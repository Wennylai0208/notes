*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

 -webkit-text-size-adjust:100%;padding:0 0 50px}

.sub{color:var(--tx3);font-size:.8em;margin:10px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
 padding:15px 15px;margin-bottom:11px;box-shadow:var(--shadow)}

/* ---- top bar / menu ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;
 justify-content:space-between;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}

.menudrop{position:absolute;right:0;top:50px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;box-shadow:var(--shadow);min-width:206px;padding:6px;display:flex;flex-direction:column;gap:2px}
.menudrop[hidden]{display:none}
.mitem{display:block;width:100%;text-align:left;padding:12px 12px;min-height:44px;border:0;background:transparent;
 color:var(--tx);font:inherit;font-size:.92em;font-weight:650;border-radius:10px;cursor:pointer}
.mitem:active{background:var(--accent2)}
.mitem:disabled{opacity:.4;cursor:default}
.mitem:disabled:active{background:transparent}

/* ---- list screen ---- */
.searchbox{width:100%;padding:12px 14px;font-size:1em;border-radius:12px;border:1px solid var(--line);
 background:var(--card);color:var(--tx);margin-bottom:10px}

.lab{font-size:.79em;color:var(--tx3);font-weight:650;margin:4px 0 8px;letter-spacing:.4px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pmeta{display:flex;justify-content:space-between;font-size:.76em;color:var(--tx3);margin-bottom:14px}
.qtag{display:inline-block;font-size:.72em;font-weight:700;color:var(--accent);
 background:var(--accent2);border-radius:99px;padding:3px 10px;margin-bottom:11px}
.qmain{font-size:1.32em;font-weight:750;line-height:1.5;word-break:break-word;margin-bottom:5px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.opt{width:100%;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);
 background:var(--card);color:var(--tx2);font:inherit;font-size:.9em;cursor:pointer;text-align:center}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);font-weight:700}
.opt:disabled{cursor:default}
.optcp{font-size:.72em;color:var(--tx3);text-align:center;padding:0 4px;line-height:1.35;word-break:break-word}
.fb{border-radius:14px;padding:13px 14px;margin-top:14px;font-size:.9em;line-height:1.75}
.fb.good{background:var(--okbg);border:1px solid var(--ok);color:var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad);color:var(--bad)}
.fb .hd{font-weight:750;font-size:1.02em;margin-bottom:5px}
.ansbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:8px;color:var(--tx)}

<script>
/* ---------- 自動偵測新版本並重整（2026-09-17）----------
   每次開啟/切回前景/從 bfcache 返回時，去問一次伺服器最新的 BUILD_ID；
   跟目前這頁不一樣才 reload，且最多每 60 秒查一次、同一個目標只重整一次（避免 loop）。
   若使用者正在輸入答案（文字輸入框有內容），先不重整，等下一次檢查再試。 */
(function(){
try{
  var BUILD_ID = "20260920191534";
  var CHECK_INTERVAL_MS = 60000;
  var RELOAD_TARGET_KEY = 'q6_reload_target';
  var SKIP_HIT_KEY = 'q6_skip_hit_once';
  var lastCheck = 0;
  var checking = false;

  function pageUrlNoQuery(){
    return location.origin + location.pathname;
  }

  function hasTypingInProgress(){
    try{
      var inputs = document.querySelectorAll('input[type="text"], input[type="search"]');
      for(var i=0;i<inputs.length;i++){
        if(inputs[i].value && inputs[i].value.length>0) return true;
      }
    }catch(e){}
    return false;
  }

  function doReload(targetId){
    try{
      sessionStorage.setItem(RELOAD_TARGET_KEY, targetId);
      sessionStorage.setItem(SKIP_HIT_KEY, '1');
    }catch(e){}
    location.reload();
  }

  function checkForUpdate(){
    if(checking) return;
    var now = Date.now();
    if(now - lastCheck < CHECK_INTERVAL_MS) return;
    lastCheck = now;
    checking = true;
    try{
      var bust = pageUrlNoQuery() + '?_cb=' + now;
      fetch(bust, {cache:'no-store'}).then(function(resp){
        if(!resp.ok) throw new Error('bad status');
        return resp.text();
      }).then(function(text){
        checking = false;
        var m = text.match(/<meta name="build-id" content="([^"]+)"/);
        if(!m) return;
        var latest = m[1];
        if(!latest || latest === BUILD_ID) return;
        var attempted = null;
        try{ attempted = sessionStorage.getItem(RELOAD_TARGET_KEY); }catch(e){}
        if(attempted === latest) return; // 同一個目標已經試過，避免無限 reload
        if(hasTypingInProgress()) return; // 使用者正在作答，先不重整，下次再檢查
        doReload(latest);
      }).catch(function(){ checking = false; });
    }catch(e){ checking = false; }
  }

  window.addEventListener('load', checkForUpdate);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkForUpdate();
  });
  window.addEventListener('pageshow', function(e){
    if(e.persisted) checkForUpdate();
  });
}catch(e){}
})();
</script>

<script>
(function(){
"use strict";
var WORDS = (DATA && DATA.words) ? DATA.words : [];
var PHRASES = (DATA && DATA.phrases) ? DATA.phrases : [];
var ROOT_GROUPS = (DATA && DATA.roots) ? DATA.roots : [];
WORDS.forEach(function(w){ w.cat='word'; });
PHRASES.forEach(function(p){ p.cat='phrase'; });
var ROOT_WORDS = [];
ROOT_GROUPS.forEach(function(rg){
  (rg.words||[]).forEach(function(w){
    ROOT_WORDS.push({ cat:'root', root:rg.root, rootMeaning:rg.meaning, word:w.word, pos:w.pos||'', zh:w.zh||'', examples:w.examples||[] });
  });
});
var ROOT_NAMES = ROOT_GROUPS.map(function(r){ return r.root; });
var PAGES = Array.from(new Set(WORDS.map(function(w){return w.page;}).filter(function(p){return p!=null;}))).sort(function(a,b){return a-b;});

var state = { screen:'list', cat:'word', page:'all', root:'all', search:'', menuOpen:false, menuSub:null, menuTypingDir:null };

function $(sel,root){ return (root||document).querySelector(sel); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function keyOf(it){
  var cat = it.cat || 'word';
  var base = (it.word||'').trim().toLowerCase()+'||'+(it.pos||'').trim().toLowerCase()+'||'+(it.zh||'').trim();
  if(cat==='word') return base;
  if(cat==='root') return 'root||'+base+'||'+(it.root||'').toLowerCase();
  return 'phrase||'+base;
}

function pageMatch(w, page){ return page==='all' || String(w.page)===String(page); }
function catLabel(cat){ return cat==='word' ? '單字' : (cat==='phrase' ? '片語' : '字根'); }
function filteredList(){
  if(state.cat==='phrase') return PHRASES.filter(function(p){ return p.word; });
  if(state.cat==='root') return ROOT_WORDS.filter(function(rw){ return rw.word && (state.root==='all' || rw.root===state.root); });
  return WORDS.filter(function(w){ return w.word && pageMatch(w, state.page); });
}

/* ---------- localStorage helpers ---------- */
function lsGet(key, fallback){
  try{ var v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; }
}
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

/* mode 省略＝選擇題（舊 key 'quiz6_wrong' 原封不動）；
   mode='typing_zh2en'＝中翻英（舊 key 'quiz6_typing_wrong' 原封不動，沿用她既有資料）；
   mode='typing_en2zh'＝英翻中，另開新 key，不動舊資料 */
function wrongKey(mode){
  if(mode==='typing_zh2en') return 'quiz6_typing_wrong';
  if(mode==='typing_en2zh') return 'quiz6_typing_wrong_en2zh';
  return 'quiz6_wrong';
}
function loadWrong(mode){ return lsGet(wrongKey(mode), []); }
function addWrong(w,mode){ var a=loadWrong(mode); var k=keyOf(w); if(a.indexOf(k)<0){ a.push(k); lsSet(wrongKey(mode),a);} }
function removeWrong(w,mode){ var a=loadWrong(mode); var k=keyOf(w); var i=a.indexOf(k); if(i>=0){ a.splice(i,1); lsSet(wrongKey(mode),a);} }
function isWrong(w,mode){ return loadWrong(mode).indexOf(keyOf(w))>=0; }
function anyWrong(mode){ return loadWrong(mode).length>0; }

/* 字根打字＝整組一起考，錯題本以「字根」為單位（不是逐字），另開 key */
function rootWrongKey(){ return 'quiz6_typing_wrong_root'; }
function loadWrongRoot(){ return lsGet(rootWrongKey(), []); }
function addWrongRoot(rootName){ var a=loadWrongRoot(); var k=String(rootName||'').trim().toLowerCase(); if(a.indexOf(k)<0){ a.push(k); lsSet(rootWrongKey(),a);} }
function removeWrongRoot(rootName){ var a=loadWrongRoot(); var k=String(rootName||'').trim().toLowerCase(); var i=a.indexOf(k); if(i>=0){ a.splice(i,1); lsSet(rootWrongKey(),a);} }
function isWrongRoot(rootName){ return loadWrongRoot().indexOf(String(rootName||'').trim().toLowerCase())>=0; }
function anyWrongRoot(){ return loadWrongRoot().length>0; }

function fcKey(){ return 'quiz6_fc_status'; }
function loadFc(){ return lsGet(fcKey(), {}); }
function setFc(w,status){ var o=loadFc(); o[keyOf(w)]=status; lsSet(fcKey(),o); }
function getFc(w){ var o=loadFc(); return o[keyOf(w)]||null; }

/* ---------- 選擇題／字卡「做到一半」進度：換頁、關掉再打開都能接著做 ---------- */
function mcSessKey(){ return 'quiz6_mc_session'; }
function saveMcSession(){
  if(state.quiz && state.quiz.qs && state.quiz.qs.length){
    lsSet(mcSessKey(), { cat:state.cat, page:state.page, root:state.root, quiz:state.quiz });
  }
}

function clearMcSession(){ try{ localStorage.removeItem(mcSessKey()); }catch(e){} }

function fcSessKey(){ return 'quiz6_fc_session'; }
function saveFcSession(){
  if(state.cards && state.cards.list && state.cards.list.length){
    lsSet(fcSessKey(), { cat:state.cat, list:state.cards.list, idx:state.cards.idx, flipped:state.cards.flipped, unsureOnly:state.cards.unsureOnly });
  }
}
function loadFcSession(){ return lsGet(fcSessKey(), null); }

/* 打字模式的進度分三條線各自存：dir='zh2en'（舊 key，沿用）／'en2zh'／'root' */
function typingSessKey(dir){
  if(dir==='en2zh') return 'quiz6_typing_session_en2zh';
  if(dir==='root') return 'quiz6_typing_session_root';
  return 'quiz6_typing_session';
}
function saveTypingSession(){
  var q = state.typing;
  if(q && q.qs && q.qs.length){
    lsSet(typingSessKey(q.dir), { cat:state.cat, page:state.page, root:state.root, typing:q });
  }

function loadTypingSession(dir){ return lsGet(typingSessKey(dir), null); }
function clearTypingSession(dir){ try{ localStorage.removeItem(typingSessKey(dir)); }catch(e){} }

/* ---------- counterpart lookup helpers (每個選項的「對應語言」小字) ---------- */
function matchCollocZh(item, answer){
  var a=(answer||'').trim().toLowerCase();
  var cols=(item&&item.collocations)||[];
  for(var i=0;i<cols.length;i++){
    if(cols[i].en && cols[i].en.trim().toLowerCase()===a) return cols[i].zh||'';
  }
  return '';
}
function clozeZh(item, answer){ return matchCollocZh(item, answer) || (item&&item.zh) || ''; }

/* ---------- 中翻英（打字）判分：大小寫不分／去頭尾空白／空白摺疊／尾端標點忽略／片語佔位詞可省略 ---------- */
function normTyped(s){
  return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,!?;:'"、。！？，；：]+$/,'').trim();
}
function stripPlaceholders(s){
  return String(s==null?'':s)
    .replace(/\bone'?s\b/gi,' ').replace(/\boneself\b/gi,' ')
    .replace(/\bsb\.?\b/gi,' ').replace(/\bsth\.?\b/gi,' ')
    .replace(/\bsomeone\b/gi,' ').replace(/\bsomething\b/gi,' ')
    .replace(/\bv-?ing\b/gi,' ').replace(/\bbev\b/gi,' ').replace(/\bdoing\b/gi,' ')
    .replace(/\s+/g,' ').trim();
}
function checkTypingAnswer(userVal, correct){
  var u = normTyped(userVal);
  if(!u) return false;
  if(u===normTyped(correct)) return true;
  var u2 = normTyped(stripPlaceholders(userVal));
  var c2 = normTyped(stripPlaceholders(correct));
  return !!u2 && u2===c2;
}
/* ---------- 英翻中（打字）寬鬆判分：拆解中文定義成關鍵字片段，命中任一段就算對 ---------- */
function normZh(s){ return String(s==null?'':s).replace(/\s+/g,'').replace(/[，,。.；;、！!？?]/g,''); }
function zhKeys(zh){
  var t = String(zh==null?'':zh)
    .replace(/[（(][^）)]*[）)]/g,'')   /* 去括號內容 */
    .replace(/…+/g,'').replace(/\.{2,}/g,''); /* 去刪節號 */
  var arr = t.split(/[；;，,、／\/]+/);
  var out = [];
  arr.forEach(function(x){
    x = x.replace(/\s+/g,'').replace(/^的+|的+$/g,'');
    if(x.length>0) out.push(x);
  });
  var full = t.replace(/\s+/g,'');
  if(full && out.indexOf(full)<0) out.push(full);
  return out;
}
function judgeZhLenient(ans, keys){
  var a = normZh(ans); if(a.length===0) return false;
  for(var i=0;i<keys.length;i++){
    var k = normZh(keys[i]); if(!k) continue;
    if(a.indexOf(k)>=0) return true;
    if(k.indexOf(a)>=0 && a.length>=2) return true;
  }
  return false;
}

/* ---------- 打字提示：片語＝字首＋其餘底線；單字＝字首＋字尾＋中間底線 ---------- */
var HINT_PLACEHOLDERS = {"sb":1,"sth":1,"ving":1,"bev":1,"one's":1,"oneself":1};
function isHintPlaceholder(tok){ return !!HINT_PLACEHOLDERS[String(tok||'').toLowerCase()]; }
function hintBlankWord(word){
  if(word.length<=1) return word;
  return word[0] + new Array(word.length).join('_');
}
function hintPhrase(text){
  return String(text==null?'':text).replace(/[A-Za-z']+/g, function(tok){
    return isHintPlaceholder(tok) ? tok : hintBlankWord(tok);
  });
}
function hintWordToken(word){
  if(word.length<=1) return word;
  if(word.length<=2) return word[0];
  return word[0] + new Array(word.length-1).join('_') + word[word.length-1];
}
function hintWordEntry(text){
  return String(text==null?'':text).replace(/[A-Za-z']+/g, function(tok){
    return hintWordToken(tok);
  });
}

/* 拼字差異標示（LCS，紅字＝答案裡使用者漏掉／拼錯的部分）*/
function diffHtml(user,ans){
  var u=String(user==null?'':user).toLowerCase(), a=String(ans==null?'':ans).toLowerCase(), A=String(ans==null?'':ans);
  var m=u.length,n=a.length,i,j;
  var dp=[]; for(i=0;i<=m;i++){dp.push(new Array(n+1)); for(j=0;j<=n;j++)dp[i][j]=0;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)dp[i][j]= u[i-1]===a[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  var keep={}; i=m;j=n;
  while(i>0&&j>0){ if(u[i-1]===a[j-1]){keep[j-1]=1;i--;j--;} else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--; }
  var out='';
  for(j=0;j<n;j++){ out += keep[j] ? esc(A[j]) : '<b>'+esc(A[j])+'</b>'; }
  return out;
}

/* ---------- global distractor pools (built once, from the real dataset; scoped per category) ---------- */
var ALL_COLS = []; /* {en, zh} unique, from WORDS */
(function(){
  var seen={};
  WORDS.forEach(function(w){
    (w.collocations||[]).forEach(function(c){
      if(!c || !c.en) return;
      var k=c.en.trim().toLowerCase();
      if(seen[k]) return; seen[k]=1;
      ALL_COLS.push({en:c.en, zh:c.zh||''});
    });
  });
})();
var ALL_PHRASES = []; /* {text, zh} pool from WORDS example answers + collocation ens, for cloze distractors */
(function(){
  var seen={};
  function add(text, zh){ if(!text) return; var k=text.trim().toLowerCase(); if(seen[k]) return; seen[k]=1; ALL_PHRASES.push({text:text, zh:zh||''}); }
  WORDS.forEach(function(w){
    (w.examples||[]).forEach(function(e){ if(e && e.answer) add(e.answer, clozeZh(w, e.answer)); });
    (w.collocations||[]).forEach(function(c){ if(c && c.en) add(c.en, c.zh||''); });
  });
})();
var PHRASE_SYN_POOL = []; /* {text, zh} unique synonym strings across PHRASES, zh = owning phrase's meaning */
(function(){
  var seen={};
  PHRASES.forEach(function(p){
    (p.synonyms||[]).forEach(function(s){
      if(!s) return; var k=s.trim().toLowerCase(); if(seen[k]) return; seen[k]=1;
      PHRASE_SYN_POOL.push({text:s, zh:p.zh||''});
    });
  });
})();
var PHRASE_EX_POOL = []; /* {text, zh} unique example answer strings across PHRASES */
(function(){
  var seen={};
  PHRASES.forEach(function(p){
    (p.examples||[]).forEach(function(e){ if(!e || !e.answer) return; var k=e.answer.trim().toLowerCase(); if(seen[k]) return; seen[k]=1; PHRASE_EX_POOL.push({text:e.answer, zh:p.zh||''}); });
  });
})();
var ROOT_EX_POOL = []; /* {text, zh} unique example answer strings across ROOT_WORDS */
(function(){
  var seen={};
  ROOT_WORDS.forEach(function(rw){
    (rw.examples||[]).forEach(function(e){ if(!e || !e.answer) return; var k=e.answer.trim().toLowerCase(); if(seen[k]) return; seen[k]=1; ROOT_EX_POOL.push({text:e.answer, zh:rw.zh||''}); });
  });
})();

function pickDistinct(pool, excludeVal, count, textOf){
  var seen={}; seen[(excludeVal||'').trim().toLowerCase()]=1;
  var cands = shuffle(pool.slice());
  var out=[];
  for(var i=0;i<cands.length && out.length<count;i++){
    var t = textOf(cands[i]);
    if(!t) continue;
    var k=t.trim().toLowerCase();
    if(seen[k]) continue;
    seen[k]=1; out.push(cands[i]);
  }
  return out;
}

/* ---------- quiz building ---------- */
function buildQuestions(wrongOnly){
  var pool = filteredList();
  var qs = [];
  if(state.cat==='word'){
    pool.forEach(function(w){
      if(wrongOnly && !isWrong(w)) return;
      if(w.zh){ qs.push({ type:'meaning2word', item:w }); qs.push({ type:'word2meaning', item:w }); }
      (w.collocations||[]).forEach(function(c){ if(c && c.en && c.zh) qs.push({ type:'colloc', item:w, col:c }); });
      (w.examples||[]).forEach(function(e){ if(e && e.en && e.answer && e.en.indexOf(e.answer)>=0) qs.push({ type:'cloze', item:w, ex:e }); });
    });
  } else if(state.cat==='phrase'){
    pool.forEach(function(p){
      if(wrongOnly && !isWrong(p)) return;
      if(p.zh){ qs.push({ type:'p_m2w', item:p }); qs.push({ type:'p_w2m', item:p }); }
      if((p.synonyms||[]).length){ qs.push({ type:'p_syn', item:p, syn:p.synonyms[Math.floor(Math.random()*p.synonyms.length)] }); }
      (p.examples||[]).forEach(function(e){ if(e && e.en && e.answer && e.en.indexOf(e.answer)>=0) qs.push({ type:'p_cloze', item:p, ex:e }); });
    });
  } else if(state.cat==='root'){
    pool.forEach(function(rw){
      if(wrongOnly && !isWrong(rw)) return;
      if(rw.zh){ qs.push({ type:'r_m2w', item:rw }); qs.push({ type:'r_w2m', item:rw }); }
      (rw.examples||[]).forEach(function(e){ if(e && e.en && e.answer && e.en.indexOf(e.answer)>=0) qs.push({ type:'r_cloze', item:rw, ex:e }); });
    });
  }
  shuffle(qs);
  qs.forEach(function(q){
    var pairs; /* [{text, cp}] cp = 該選項對應的另一種語言（英選項配中文、中選項配英文），沒有就空字串 */
    if(q.type==='meaning2word'){
      var d1 = pickDistinct(WORDS, q.item.word, 3, function(x){ return x.word; });
      pairs = [{text:q.item.word, cp:q.item.zh||''}].concat(d1.map(function(x){ return {text:x.word, cp:x.zh||''}; }));
    } else if(q.type==='word2meaning'){
      var d2 = pickDistinct(WORDS, q.item.zh, 3, function(x){ return x.zh; });
      pairs = [{text:q.item.zh, cp:q.item.word||''}].concat(d2.map(function(x){ return {text:x.zh, cp:x.word||''}; }));
    } else if(q.type==='colloc'){
      var d3 = pickDistinct(ALL_COLS, q.col.en, 3, function(x){ return x.en; });
      pairs = [{text:q.col.en, cp:q.col.zh||''}].concat(d3.map(function(x){ return {text:x.en, cp:x.zh||''}; }));
    } else if(q.type==='cloze'){
      var d4 = pickDistinct(ALL_PHRASES, q.ex.answer, 3, function(x){ return x.text; });
      pairs = [{text:q.ex.answer, cp:clozeZh(q.item, q.ex.answer)}].concat(d4.map(function(x){ return {text:x.text, cp:x.zh||''}; }));
    } else if(q.type==='p_m2w'){
      var d5 = pickDistinct(PHRASES, q.item.word, 3, function(x){ return x.word; });
      pairs = [{text:q.item.word, cp:q.item.zh||''}].concat(d5.map(function(x){ return {text:x.word, cp:x.zh||''}; }));
    } else if(q.type==='p_w2m'){
      var d6 = pickDistinct(PHRASES, q.item.zh, 3, function(x){ return x.zh; });
      pairs = [{text:q.item.zh, cp:q.item.word||''}].concat(d6.map(function(x){ return {text:x.zh, cp:x.word||''}; }));
    } else if(q.type==='p_syn'){
      var d7 = pickDistinct(PHRASE_SYN_POOL, q.syn, 3, function(x){ return x.text; });
      pairs = [{text:q.syn, cp:q.item.zh||''}].concat(d7.map(function(x){ return {text:x.text, cp:x.zh||''}; }));
    } else if(q.type==='p_cloze'){
      var d8 = pickDistinct(PHRASE_EX_POOL, q.ex.answer, 3, function(x){ return x.text; });
      pairs = [{text:q.ex.answer, cp:q.item.zh||''}].concat(d8.map(function(x){ return {text:x.text, cp:x.zh||''}; }));
    } else if(q.type==='r_m2w'){
      var d9 = pickDistinct(ROOT_WORDS, q.item.word, 3, function(x){ return x.word; });
      pairs = [{text:q.item.word, cp:q.item.zh||''}].concat(d9.map(function(x){ return {text:x.word, cp:x.zh||''}; }));
    } else if(q.type==='r_w2m'){
      var d10 = pickDistinct(ROOT_WORDS, q.item.zh, 3, function(x){ return x.zh; });
      pairs = [{text:q.item.zh, cp:q.item.word||''}].concat(d10.map(function(x){ return {text:x.zh, cp:x.word||''}; }));
    } else if(q.type==='r_cloze'){
      var d11 = pickDistinct(ROOT_EX_POOL, q.ex.answer, 3, function(x){ return x.text; });
      pairs = [{text:q.ex.answer, cp:q.item.zh||''}].concat(d11.map(function(x){ return {text:x.text, cp:x.zh||''}; }));
    }
    if(pairs){
      shuffle(pairs);
      q.options = pairs.map(function(p){ return p.text; });
      q.optionCp = pairs.map(function(p){ return p.cp||''; });
    }
  });
  return qs.filter(function(q){ return q.options && q.options.length>=2; });
}

/* ---------- 打字（單字／片語）題庫：每個項目一題；modeKey 決定用哪本錯題本 ---------- */
function buildTypingQuestions(wrongOnly, modeKey){
  var pool = filteredList();
  var qs = [];
  pool.forEach(function(it){
    if(wrongOnly && !isWrong(it, modeKey)) return;
    if(it.word && it.zh) qs.push({ item:it, answered:false });
  });
  shuffle(qs);
  return qs;
}

/* ---------- 字根打字題庫：一組字根＝一題，底下每個字各一列，一次送出整組 ---------- */
function buildRootTypingGroups(wrongOnly){
  var groups = ROOT_GROUPS.filter(function(rg){ return (rg.words||[]).length>0; });
  if(state.root!=='all'){ groups = groups.filter(function(rg){ return rg.root===state.root; }); }
  if(wrongOnly){ groups = groups.filter(function(rg){ return isWrongRoot(rg.root); }); }
  var qs = groups.map(function(rg){
    return {
      root: rg.root,
      meaning: rg.meaning||'',
      answered: false,
      rows: (rg.words||[]).map(function(w){
        return { word:w.word, pos:w.pos||'', zh:w.zh||'', examples:w.examples||[], userVal:'', answered:false, ok:false };
      })
    };
  });
  shuffle(qs);
  return qs;
}

function collocLine(c){
  return '<div class="sub">▸ <b>'+esc(c.en)+'</b>　'+esc(c.zh||'')+'</div>';
}
function exampleLine(e){
  var en=e.en||'', ans=e.answer||'';
  var i = ans ? en.indexOf(ans) : -1;
  var html;
  if(i>=0){ html = esc(en.slice(0,i))+'<b>'+esc(ans)+'</b>'+esc(en.slice(i+ans.length)); }
  else { html = esc(en); }
  return '<div class="sub">e.g. '+html+'</div>';
}

function itemHay(it){
  var parts = [it.word||'', it.zh||''];
  if(it.cat==='phrase') parts.push((it.synonyms||[]).join(' '));
  if(it.cat==='root') parts.push(it.root||'');
  return parts.join(' ').toLowerCase();
}
function itemBadge(it){
  if(it.cat==='word') return '<span class="pg">p.'+esc(it.page)+'</span>';
  if(it.cat==='phrase') return '<span class="pg">No.'+esc(it.no)+'</span>';
  if(it.cat==='root') return '<span class="pg">'+esc(it.root)+'</span>';
  return '';
}
function itemSubLines(it){
  var subs = '';
  if(it.cat==='word'){ subs += (it.collocations||[]).map(collocLine).join(''); }
  if(it.cat==='phrase' && (it.synonyms||[]).length){
    subs += '<div class="sub">＝ '+it.synonyms.map(esc).join('　＝ ')+'</div>';
  }
  subs += (it.examples||[]).map(exampleLine).join('');
  if(it.note) subs += '<div class="sub">'+esc(it.note)+'</div>';
  return subs;
}

var TYPE_TAG = {
  meaning2word:'中翻英', word2meaning:'英翻中', colloc:'搭配詞', cloze:'例句挖空',
  p_m2w:'中翻英', p_w2m:'英翻中', p_syn:'同義替換', p_cloze:'例句挖空',
  r_m2w:'中翻英', r_w2m:'英翻中', r_cloze:'例句挖空'
};

function questionPrompt(cur){
  var it = cur.item;
  if(cur.type==='meaning2word' || cur.type==='p_m2w' || cur.type==='r_m2w'){
    return esc(it.zh) + (it.pos ? '（'+esc(it.pos)+'）' : '');
  }
  if(cur.type==='word2meaning'){
    return esc(it.word) + (it.phonetic ? '<span class="ipa2">'+esc(it.phonetic)+'</span>' : '');
  }
  if(cur.type==='p_w2m' || cur.type==='r_w2m'){
    return esc(it.word) + (it.pos ? '<span class="ipa2">'+esc(it.pos)+'</span>' : '');
  }
  if(cur.type==='colloc'){
    return esc(cur.col.zh);
  }
  if(cur.type==='p_syn'){
    return esc(it.word) + (it.zh ? '<span class="ipa2">'+esc(it.zh)+'</span>' : '');
  }
  if(cur.type==='cloze' || cur.type==='p_cloze' || cur.type==='r_cloze'){
    var en=cur.ex.en, ans=cur.ex.answer, i=en.indexOf(ans);
    return esc(en.slice(0,i)) + '<u>_____</u>' + esc(en.slice(i+ans.length));
  }
  return '';
}
function correctAnswer(cur){
  var it = cur.item;
  if(cur.type==='meaning2word' || cur.type==='p_m2w' || cur.type==='r_m2w') return it.word;
  if(cur.type==='word2meaning' || cur.type==='p_w2m' || cur.type==='r_w2m') return it.zh;
  if(cur.type==='colloc') return cur.col.en;
  if(cur.type==='p_syn') return cur.syn;
  if(cur.type==='cloze' || cur.type==='p_cloze' || cur.type==='r_cloze') return cur.ex.answer;
  return '';
}

  if(q.qs.length===0){
    return '<button class="back" data-act="home">← 回單字清單</button>'+
      '<div class="card empty">目前沒有可以出的題目'+(q.wrongOnly?'（沒有錯題了，太厲害了）':'')+'</div>';
  }
  if(q.idx>=q.qs.length){ state.screen='result'; clearMcSession(); return renderResult(); }
  var cur = q.qs[q.idx];
  var pct = Math.round(q.idx/q.qs.length*100);
  var correct = correctAnswer(cur);
  var answered = !!cur.answered;
  var optsHtml = cur.options.map(function(opt,oi){
    var cls = 'opt';
    if(answered){
      if(opt===correct) cls += ' good';
      else if(opt===cur.selected) cls += ' bad';
    }
    var cpTxt = (cur.optionCp && cur.optionCp[oi]) ? cur.optionCp[oi] : '';
    var cpHtml = (answered && cpTxt) ? '<div class="optcp">'+esc(cpTxt)+'</div>' : '';
    return '<div class="optwrap"><button class="'+cls+'" data-act="pick" data-opt="'+esc(opt)+'"'+(answered?' disabled':'')+'>'+esc(opt)+'</button>'+cpHtml+'</div>';
  }).join('');
  var fb = '';
  if(answered){
    var ok = cur.selected===correct;
    var w = cur.item;
    var extra = '';
    if(cur.type==='colloc'){
      extra = '<div class="exsent"><b>'+esc(cur.col.en)+'</b>　'+esc(cur.col.zh||'')+'</div>';
    } else if(cur.type==='cloze' || cur.type==='p_cloze' || cur.type==='r_cloze'){
      var en2=cur.ex.en, ans2=cur.ex.answer, i2=en2.indexOf(ans2);
      extra = '<div class="exsent">'+esc(en2.slice(0,i2))+'<b>'+esc(ans2)+'</b>'+esc(en2.slice(i2+ans2.length))+'</div>';
    } else if(cur.type==='p_syn' && (w.synonyms||[]).length){
      extra = '<div class="exsent">同義：'+w.synonyms.map(esc).join('　＝ ')+'</div>';
    }
    fb = '<div class="fb '+(ok?'good':'bad')+'">'+
      '<div class="hd">'+(ok?'答對了 🎉':'答錯了')+'</div>'+
      '<div class="ansbox"><span class="answ">'+esc(w.word)+'</span><span class="ipa2">'+esc(w.phonetic||w.pos||'')+'</span>'+
      '<div class="zh2">'+esc(w.zh||'')+'</div>'+ extra +
      '</div></div>'+
      '<button class="btn" data-act="next">'+(q.idx+1>=q.qs.length?'看結果':'下一題')+'</button>';
  }
  return ''+
  '<button class="back" data-act="home">← 回單字清單</button>'+
  '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
  '<div class="pmeta"><span>第 '+(q.idx+1)+' / '+q.qs.length+' 題</span><span>答對 '+q.score+'</span></div>'+
  '<div class="card">'+
    '<div class="qtag">'+esc(TYPE_TAG[cur.type]||'')+'</div>'+
    '<div class="qmain">'+questionPrompt(cur)+'</div>'+
    '<div class="opts">'+optsHtml+'</div>'+
  '</div>'+
  fb;
}

function renderResult(){
  var q = state.quiz;
  if(!q) return renderList();
  return ''+
  '<button class="back" data-act="home">← 回單字清單</button>'+
  '<div class="card score"><div class="n">'+q.score+' / '+q.qs.length+'</div><div class="d">答對題數</div></div>'+
  '<button class="btn" data-act="start-quiz" data-mode="'+(q.wrongOnly?'wrong':'all')+'">再玩一次</button>'+
  '<button class="btn ghost" data-act="home">回單字清單</button>';
}

function renderTyping(){
  var q = state.typing;
  if(!q) return renderList();
  if(q.dir==='root') return renderTypingRoot();
  if(q.qs.length===0){
    return '<button class="back" data-act="home">← 回單字清單</button>'+
      '<div class="card empty">目前沒有可以出的題目'+(q.wrongOnly?'（沒有錯題了，太厲害了）':'')+'</div>';
  }
  if(q.idx>=q.qs.length){ state.screen='typingResult'; clearTypingSession(q.dir); return renderTypingResult(); }
  var cur = q.qs[q.idx];
  var pct = Math.round(q.idx/q.qs.length*100);
  var it = cur.item;
  var correct = it.word;
  var answered = !!cur.answered;
  var isEn2zh = q.dir==='en2zh';
  var qtagTxt = (isEn2zh?'英翻中':'中翻英')+'・'+catLabel(it.cat)+(it.pos?'・'+it.pos:'');
  var qmainHtml;
  if(isEn2zh){
    var ipaPos = [it.phonetic||'', it.pos||''].filter(function(s){return s;}).join('　');
    qmainHtml = esc(it.word) + (ipaPos ? '<span class="ipa2">'+esc(ipaPos)+'</span>' : '') + itemBadge(it);
  } else {
    qmainHtml = esc(it.zh) + itemBadge(it);
  }
  var bodyHtml;
  if(!answered){
    var hintHtml = '';
    if(!isEn2zh){
      var hintTxt = it.cat==='phrase' ? hintPhrase(it.word) : hintWordEntry(it.word);
      hintHtml = '<div class="hintline">提示：'+esc(hintTxt)+'</div>';
    }
    bodyHtml = hintHtml+'<input type="text" class="typein" id="typeIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+(isEn2zh?'輸入中文意思…':'輸入英文…')+'">'+
      '<button class="btn" data-act="typesubmit">送出</button>';
  } else {
    var ok = cur.ok;
    var extra = '';
    if((it.examples||[]).length){ extra += it.examples.map(exampleLine).join(''); }
    if(it.cat==='word' && (it.collocations||[]).length){ extra += it.collocations.map(collocLine).join(''); }
    if(it.cat==='phrase' && (it.synonyms||[]).length){ extra += '<div class="sub">＝ '+it.synonyms.map(esc).join('　＝ ')+'</div>'; }
    var wroteHtml = '<div class="wrote">你寫：'+esc(cur.userVal||'')+'</div>';
    if(!isEn2zh && !ok){
      wroteHtml += '<div class="wrote">正確：<span class="dif">'+diffHtml(cur.userVal||'', correct)+'</span>（紅色是漏掉／拼錯的地方）</div>';
    }
    bodyHtml = '<div class="fb '+(ok?'good':'bad')+'">'+
      '<div class="hd">'+(ok?'答對了 🎉':'答錯了')+'</div>'+ wroteHtml +
      '<div class="ansbox"><span class="answ">'+esc(it.word)+'</span><span class="ipa2">'+esc(it.phonetic||it.pos||'')+'</span>'+
      '<div class="zh2">'+esc(it.zh||'')+'</div>'+ extra +
      '</div></div>'+
      '<button class="btn" data-act="typenext">'+(q.idx+1>=q.qs.length?'看結果':'下一題')+'</button>';
  }
  return ''+
  '<button class="back" data-act="home">← 回單字清單</button>'+
  '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
  '<div class="pmeta"><span>第 '+(q.idx+1)+' / '+q.qs.length+' 題</span><span>答對 '+q.score+'</span></div>'+
  '<div class="card">'+
    '<div class="qtag">'+esc(qtagTxt)+'</div>'+
    '<div class="qmain">'+qmainHtml+'</div>'+
    (answered ? '' : bodyHtml)+
  '</div>'+
  (answered ? bodyHtml : '');
}

/* 字根：一題＝一整組，每個字一列，一次送出整組 */
function renderTypingRoot(){
  var q = state.typing;
  if(!q) return renderList();
  if(q.qs.length===0){
    return '<button class="back" data-act="home">← 回單字清單</button>'+
      '<div class="card empty">目前沒有可以出的題目'+(q.wrongOnly?'（沒有錯題了，太厲害了）':'')+'</div>';
  }
  if(q.idx>=q.qs.length){ state.screen='typingResult'; clearTypingSession('root'); return renderTypingResult(); }
  var cur = q.qs[q.idx];
  var pct = Math.round(q.idx/q.qs.length*100);
  var answered = !!cur.answered;
  var rowsHtml = cur.rows.map(function(r, ri){
    if(!answered){
      var hint = hintWordEntry(r.word);
      return '<div class="rootrow">'+
        '<div class="rr-zh">'+esc(r.zh)+(r.pos?'　<span class="ipa2">'+esc(r.pos)+'</span>':'')+'</div>'+
        '<div class="hintline">提示：'+esc(hint)+'</div>'+
        '<input type="text" class="typein rootin" data-ri="'+ri+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入英文…">'+
        '</div>';
    }
    var rowCls = 'rootrow '+(r.ok?'good':'bad');
    return '<div class="'+rowCls+'">'+
      '<div class="rr-zh">'+esc(r.zh)+(r.pos?'　<span class="ipa2">'+esc(r.pos)+'</span>':'')+'</div>'+
      '<div class="wrote">你寫：'+esc(r.userVal||'（空白）')+'</div>'+
      (r.ok ? '<div class="wrote">✅ '+esc(r.word)+'</div>' : '<div class="wrote">正確：<span class="dif">'+diffHtml(r.userVal||'', r.word)+'</span></div>')+
      '</div>';
  }).join('');
  var submitHtml = answered
    ? '<button class="btn" data-act="rootnext">'+(q.idx+1>=q.qs.length?'看結果':'下一組')+'</button>'
    : '<button class="btn" data-act="rootsubmit">送出整組</button>';
  return ''+
  '<button class="back" data-act="home">← 回單字清單</button>'+
  '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
  '<div class="pmeta"><span>第 '+(q.idx+1)+' / '+q.qs.length+' 組</span><span>答對 '+q.score+'</span></div>'+
  '<div class="card">'+
    '<div class="qtag">字根</div>'+
    '<div class="qmain">'+esc(cur.root)+'<span class="ipa2">'+esc(cur.meaning||'')+'</span></div>'+
    rowsHtml+
    submitHtml+
  '</div>';
}

function renderTypingResult(){
  var q = state.typing;
  if(!q) return renderList();
  var unitLabel = q.dir==='root' ? '組數' : '題數';
  return ''+
  '<button class="back" data-act="home">← 回單字清單</button>'+
  '<div class="card score"><div class="n">'+q.score+' / '+q.qs.length+'</div><div class="d">答對'+unitLabel+'</div></div>'+
  '<button class="btn" data-act="start-typing" data-mode="'+(q.wrongOnly?'wrong':'all')+'" data-dir="'+q.dir+'">再玩一次</button>'+
  '<button class="btn ghost" data-act="home">回單字清單</button>';
}

function renderCards(){
  var c = state.cards;
  if(!c) return renderList();
  var list = c.list;
  var head = '<button class="back" data-act="home">← 回單字清單</button>'+
    '<div class="toprow"><h1 style="margin:0;font-size:1.05em">字卡（'+catLabel(state.cat)+'）</h1>'+
    '<label class="chk"><input type="checkbox" id="unsureOnly"'+(c.unsureOnly?' checked':'')+'> 只看還不熟</label></div>';
  if(list.length===0){
    return head+'<div class="card empty">沒有卡片可以看</div>';
  }
  if(c.idx>=list.length) c.idx=0;
  var w = list[c.idx];
  var status = getFc(w);
  var body;
  if(!c.flipped){
    body = '<div class="cf-word">'+esc(w.word)+'</div><div class="cf-ipa">'+esc(w.phonetic||'')+'</div>'+
      '<div class="cf-hint">點卡片看解釋</div>';
  } else {
    var colHtml = '';
    if(w.cat==='word' && (w.collocations||[]).length){
      colHtml = '<div class="cf-col">'+w.collocations.map(function(c2){
        return '<div class="cf-colitem"><b>'+esc(c2.en)+'</b>　'+esc(c2.zh||'')+'</div>';
      }).join('')+'</div>';
    } else if(w.cat==='phrase' && (w.synonyms||[]).length){
      colHtml = '<div class="cf-col">'+w.synonyms.map(function(s){
        return '<div class="cf-colitem">＝ '+esc(s)+'</div>';
      }).join('')+'</div>';
    } else if(w.cat==='root'){
      colHtml = '<div class="cf-col"><div class="cf-colitem">字根 <b>'+esc(w.root)+'</b>　'+esc(w.rootMeaning||'')+'</div></div>';
    }
    var exHtml = '';
    if((w.examples||[]).length){
      exHtml = '<div class="cf-ex">'+w.examples.map(exampleLine).join('')+'</div>';
    }
    body = '<div class="cf-pos">'+esc(w.pos||'')+'</div>'+
      '<div class="cf-word" style="font-size:1.25em">'+esc(w.word)+'<span class="cf-ipa" style="display:inline">'+esc(w.phonetic||'')+'</span></div>'+
      '<div class="cf-zh">'+esc(w.zh||'')+'</div>'+ colHtml + exHtml;
  }
  return head+
  '<div class="pmeta"><span>'+(c.idx+1)+' / '+list.length+'</span><span>'+(status==='know'?'✅ 我會了':(status==='unsure'?'🟡 還不熟':''))+'</span></div>'+
  '<div class="cardbox" data-act="flip">'+body+'</div>'+
  '<div class="fcrow">'+
    '<button class="btn ghost" data-act="mark" data-status="unsure">還不熟</button>'+
    '<button class="btn" data-act="mark" data-status="know">我會了</button>'+
  '</div>'+
  '<div class="navrow">'+
    '<button class="btn ghost" data-act="prev">◀ 上一張</button>'+
    '<button class="btn ghost" data-act="shuffle">🔀 洗牌</button>'+
    '<button class="btn ghost" data-act="nextcard">下一張 ▶</button>'+
  '</div>';
}

/* ---------- actions ---------- */
function startQuiz(mode){
  clearMcSession();
  var wrongOnly = mode==='wrong' && anyWrong();
  state.quiz = { qs:buildQuestions(wrongOnly), idx:0, score:0, wrongOnly:wrongOnly };
  state.screen = 'quiz';
}
function startCards(){
  clearFcSession();
  state.cards = { list: buildDeck(false), idx:0, flipped:false, unsureOnly:false };
  state.screen = 'cards';
}
/* navMode:'all'|'wrong'　dir:'zh2en'|'en2zh'|'root' */
function startTyping(navMode, dir){
  clearTypingSession(dir);
  if(dir==='root'){
    var wrongOnlyR = navMode==='wrong' && anyWrongRoot();
    state.typing = { qs:buildRootTypingGroups(wrongOnlyR), idx:0, score:0, wrongOnly:wrongOnlyR, dir:'root' };
  } else {
    var modeKey = dir==='en2zh' ? 'typing_en2zh' : 'typing_zh2en';
    var wrongOnly = navMode==='wrong' && anyWrong(modeKey);
    state.typing = { qs:buildTypingQuestions(wrongOnly, modeKey), idx:0, score:0, wrongOnly:wrongOnly, dir:dir };
  }
  state.screen = 'typing';
}
function typeSubmit(){
  var inp = document.getElementById('typeIn');
  if(!inp) return;
  var val = inp.value;
  if(!val.trim()){ inp.focus(); return; }
  var q = state.typing; var cur = q.qs[q.idx];
  if(!cur || cur.answered) return;
  var isEn2zh = q.dir==='en2zh';
  var modeKey = isEn2zh ? 'typing_en2zh' : 'typing_zh2en';
  var ok = isEn2zh ? judgeZhLenient(val, zhKeys(cur.item.zh)) : checkTypingAnswer(val, cur.item.word);
  cur.answered = true; cur.userVal = val; cur.ok = ok;
  if(ok){ q.score++; removeWrong(cur.item, modeKey); }
  else { addWrong(cur.item, modeKey); }
  saveTypingSession();
  render();
}
function rootSubmit(){
  var q = state.typing; var cur = q.qs[q.idx];
  if(!cur || cur.answered) return;
  var app = $('#app');
  var inputs = app.querySelectorAll('.rootin');
  var valByRi = {};
  Array.prototype.forEach.call(inputs, function(el){ valByRi[el.getAttribute('data-ri')] = el.value; });
  var allOk = true;
  cur.rows.forEach(function(r, ri){
    var val = valByRi[String(ri)] || '';
    var ok = checkTypingAnswer(val, r.word);
    r.userVal = val; r.ok = ok; r.answered = true;
    if(!ok) allOk = false;
  });
  cur.answered = true;
  if(allOk){ q.score++; removeWrongRoot(cur.root); } else { addWrongRoot(cur.root); }
  saveTypingSession();
  render();
}

function closeMenu(){ state.menuOpen=false; state.menuSub=null; state.menuTypingDir=null; }

function bind(){
  var app = $('#app');
  app.onclick = function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    var act = t.getAttribute('data-act');
    if(act==='home'){ closeMenu(); state.screen='list'; render(); }
    else if(act==='open-mc-sub'){ state.menuSub='mc'; render(); }
    else if(act==='open-typing-sub'){ state.menuSub='typing'; state.menuTypingDir=null; render(); }
    else if(act==='back-menu'){ state.menuSub=null; state.menuTypingDir=null; render(); }
    else if(act==='pick-typing-dir'){ state.menuTypingDir=t.getAttribute('data-dir'); render(); }
    else if(act==='back-typing-dir'){ state.menuTypingDir=null; render(); }
    else if(act==='start-quiz'){ closeMenu(); startQuiz(t.getAttribute('data-mode')); render(); }
    else if(act==='start-typing'){ closeMenu(); startTyping(t.getAttribute('data-mode'), t.getAttribute('data-dir')); render(); }
    else if(act==='start-cards'){ closeMenu(); startCards(); render(); }
    else if(act==='typesubmit'){ typeSubmit(); }
    else if(act==='typenext'){ state.typing.idx++; saveTypingSession(); render(); }
    else if(act==='rootsubmit'){ rootSubmit(); }
    else if(act==='rootnext'){ state.typing.idx++; saveTypingSession(); render(); }
    else if(act==='resume-typing'){
      var rDir = t.getAttribute('data-dir');
      var sTy = loadTypingSession(rDir);
      if(sTy && sTy.typing){ state.cat=sTy.cat; state.page=sTy.page; state.root=sTy.root; state.typing=sTy.typing; state.screen='typing'; }
      render();
    }
    else if(act==='discard-typing'){ clearTypingSession(t.getAttribute('data-dir')); render(); }
    else if(act==='setcat'){ state.cat = t.getAttribute('data-cat'); render(); }
    else if(act==='setpage'){ state.page = t.getAttribute('data-page'); render(); }
    else if(act==='setroot'){ state.root = t.getAttribute('data-root'); render(); }
    else if(act==='pick'){
      var q = state.quiz; var cur = q.qs[q.idx];
      if(cur.answered) return;
      var opt = t.getAttribute('data-opt');
      cur.answered = true; cur.selected = opt;
      var correct = correctAnswer(cur);
      var ok = opt===correct;
      if(ok){ q.score++; removeWrong(cur.item); }
      else { addWrong(cur.item); }
      saveMcSession();
      render();
    }
    else if(act==='next'){ state.quiz.idx++; saveMcSession(); render(); }
    else if(act==='resume-mc'){
      var sMc = loadMcSession();
      if(sMc && sMc.quiz){ state.cat=sMc.cat; state.page=sMc.page; state.root=sMc.root; state.quiz=sMc.quiz; state.screen='quiz'; }
      render();
    }
    else if(act==='discard-mc'){ clearMcSession(); render(); }
    else if(act==='resume-fc'){
      var sFc = loadFcSession();
      if(sFc && sFc.list && sFc.list.length){ state.cat=sFc.cat; state.cards={list:sFc.list, idx:sFc.idx, flipped:sFc.flipped, unsureOnly:sFc.unsureOnly}; state.screen='cards'; }
      render();
    }
    else if(act==='discard-fc'){ clearFcSession(); render(); }
    else if(act==='flip'){ state.cards.flipped = !state.cards.flipped; saveFcSession(); render(); }
    else if(act==='mark'){
      var c = state.cards; var w = c.list[c.idx];
      var status = t.getAttribute('data-status');
      setFc(w, status);
      if(status==='unsure'){ addWrong(w); } else { removeWrong(w); }
      c.flipped = false;
      c.idx = Math.min(c.idx+1, Math.max(0,c.list.length-1));
      saveFcSession();
      render();
    }
    else if(act==='prev'){ var c2=state.cards; c2.idx=Math.max(0,c2.idx-1); c2.flipped=false; saveFcSession(); render(); }
    else if(act==='nextcard'){ var c3=state.cards; c3.idx=Math.min(c3.list.length-1,c3.idx+1); c3.flipped=false; saveFcSession(); render(); }
    else if(act==='shuffle'){ shuffle(state.cards.list); state.cards.idx=0; state.cards.flipped=false; saveFcSession(); render(); }
  };
  var menuBtn = $('#menuBtn', app);
  if(menuBtn){ menuBtn.onclick = function(e){ e.stopPropagation(); state.menuOpen = !state.menuOpen; if(!state.menuOpen) state.menuSub=null; render(); }; }
  var typeIn = $('#typeIn', app);
  if(typeIn){
    typeIn.focus();
    typeIn.onkeydown = function(e){ if(e.key==='Enter'||e.keyCode===13){ e.preventDefault(); typeSubmit(); } };
  }
  var searchBox = $('#searchBox', app);
  if(searchBox){
    searchBox.oninput = function(){
      state.search = searchBox.value;
      var q = state.search.trim().toLowerCase();
      var grid = $('#wgrid', app);
      if(!grid) return;
      var cells = grid.querySelectorAll('.wcell');
      for(var i=0;i<cells.length;i++){
        var hay = cells[i].getAttribute('data-hay')||'';
        cells[i].hidden = !!q && hay.indexOf(q)<0;
      }
    };
  }
  var unsureChk = $('#unsureOnly', app);
  if(unsureChk){ unsureChk.onchange = function(){
    var c = state.cards; c.unsureOnly = unsureChk.checked;
    c.list = buildDeck(c.unsureOnly); c.idx=0; c.flipped=false; saveFcSession(); render();
  }; }
}

/* capture phase：一定要在 app.onclick 觸發整個 innerHTML 重繪之前先判斷，
   否則 e.target 在重繪後會變成已脫離文件的舊節點，containment 判斷會失準 */
document.addEventListener('click', function(e){
  if(state.menuOpen){
    var d = document.getElementById('menuDrop');
    if(d && !d.contains(e.target) && e.target.id!=='menuBtn'){ state.menuOpen=false; state.menuSub=null; render(); }
  }
}, true);

render();
})();
</script>
<script>
/* 靜默開啟計數（不顯示任何數字）。?v=<tag> 時另記一筆該人的專屬計數。
   自動重整（偵測到新版本）不重複計數：sessionStorage 旗標命中就跳過這一次並清除旗標。 */
(function(){try{
  var skip=false;
  try{
    if(sessionStorage.getItem('q6_skip_hit_once')==='1'){
      skip=true;
      sessionStorage.removeItem('q6_skip_hit_once');
    }
  }catch(e){}
