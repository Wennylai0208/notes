<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>GSAT 單字 P124-128</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
:root{
 --bg:#f6f7f9; --card:#fff; --tx:#16181d; --tx2:#3f4652; --tx3:#6b7280;
 --line:#e5e7eb; --accent:#2f7de1; --accent2:#e8f1fd; --ok:#1a9c62; --okbg:#e7f6ee;
 --bad:#d84a4a; --badbg:#fdecec; --warn:#b8860b;
 --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
 :root{--bg:#0f1115;--card:#171a21;--tx:#e8eaed;--tx2:#c7ccd4;--tx3:#9aa1ac;
  --line:#262b35;--accent:#5aa2ff;--accent2:#1b2637;--ok:#4bd39a;--okbg:#15291f;
  --bad:#ff7b7b;--badbg:#2c1a1a;--warn:#e0b558;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
 font:16.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 -webkit-text-size-adjust:100%;padding:0 0 50px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 0}
h1{font-size:1.15em;margin:0;font-weight:750;letter-spacing:.2px}
.sub{color:var(--tx3);font-size:.8em;margin:10px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
 padding:15px 15px;margin-bottom:11px;box-shadow:var(--shadow)}

/* ---- top bar / menu ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;
 justify-content:space-between;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.topbar .ttl{font-size:1.02em;font-weight:750}
.menuwrap{position:relative}
.menubtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);
 color:var(--tx);font-size:1.3em;font-weight:700;cursor:pointer;line-height:1}
.menudrop{position:absolute;right:0;top:50px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;box-shadow:var(--shadow);min-width:206px;padding:6px;display:flex;flex-direction:column;gap:2px}
.menudrop[hidden]{display:none}
.mitem{display:block;width:100%;text-align:left;padding:12px 12px;min-height:44px;border:0;background:transparent;
 color:var(--tx);font:inherit;font-size:.92em;font-weight:650;border-radius:10px;cursor:pointer}
.mitem:active{background:var(--accent2)}

/* ---- list screen ---- */
.searchbox{width:100%;padding:12px 14px;font-size:1em;border-radius:12px;border:1px solid var(--line);
 background:var(--card);color:var(--tx);margin-bottom:10px}
.searchbox:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:8px 13px;min-height:36px;border-radius:99px;border:1px solid var(--line);background:var(--card);
 color:var(--tx2);font:inherit;font-size:.85em;font-weight:650;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lab{font-size:.79em;color:var(--tx3);font-weight:650;margin:4px 0 8px;letter-spacing:.4px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px 10px;min-width:0}
.wcell b{font-weight:750;font-size:1em;word-break:break-word}
.wcell .pg{color:var(--tx3);font-size:.68em;font-weight:700;background:var(--accent2);color:var(--accent);
 border-radius:6px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.wcell .ipa{color:var(--tx3);font-size:.72em;display:block;margin-top:1px}
.wcell .pos{color:var(--tx3);font-size:.72em;font-weight:600}
.wcell .zh{font-size:.85em;line-height:1.42;color:var(--tx2);margin-top:2px;overflow-wrap:break-word;word-break:break-word;font-weight:650}
.wcell .sub{font-size:.72em;color:var(--tx3);margin:4px 0 0;padding-left:8px;border-left:2px solid var(--line);line-height:1.55}
.wcell .sub b{font-weight:700;color:var(--tx2);font-size:1em}
.empty{color:var(--tx3);font-size:.9em;text-align:center;padding:24px 8px}

/* ---- quiz ---- */
.btn{width:100%;padding:14px;border:0;border-radius:13px;background:var(--accent);color:#fff;
 font:inherit;font-weight:700;font-size:1em;cursor:pointer;margin-top:12px}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--tx3);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.45}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:.88em;cursor:pointer;
 padding:6px 0;margin-bottom:8px;font-weight:600}
.pbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:7px}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.pmeta{display:flex;justify-content:space-between;font-size:.76em;color:var(--tx3);margin-bottom:14px}
.qtag{display:inline-block;font-size:.72em;font-weight:700;color:var(--accent);
 background:var(--accent2);border-radius:99px;padding:3px 10px;margin-bottom:11px}
.qmain{font-size:1.32em;font-weight:750;line-height:1.5;word-break:break-word;margin-bottom:5px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{flex:1 1 42%;min-width:110px;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);
 background:var(--card);color:var(--tx2);font:inherit;font-size:.9em;cursor:pointer;text-align:center}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);font-weight:700}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:13px 14px;margin-top:14px;font-size:.9em;line-height:1.75}
.fb.good{background:var(--okbg);border:1px solid var(--ok);color:var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad);color:var(--bad)}
.fb .hd{font-weight:750;font-size:1.02em;margin-bottom:5px}
.ansbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:8px;color:var(--tx)}
.answ{font-size:1.05em;font-weight:750}
.ipa2{color:var(--tx3);font-size:.83em;margin-left:6px;font-weight:400}
.zh2{margin-top:3px;color:var(--tx2);font-size:.92em}
.exsent{margin-top:8px;font-size:.88em;color:var(--tx2);line-height:1.65}
.exsent b{color:var(--accent);text-decoration:underline;font-weight:800}
.score{text-align:center;padding:10px 0 4px}
.score .n{font-size:2.6em;font-weight:800;line-height:1.15}
.score .d{color:var(--tx3);font-size:.85em}

/* ---- flashcards ---- */
.cardbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 18px;
 box-shadow:var(--shadow);min-height:220px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;cursor:pointer}
.cf-word{font-size:1.7em;font-weight:800}
.cf-ipa{color:var(--tx3);font-size:.9em;margin-top:6px}
.cf-pos{color:var(--tx3);font-size:.85em;font-weight:650;margin-bottom:6px}
.cf-zh{font-size:1.08em;color:var(--tx);margin-bottom:10px}
.cf-col{margin-top:10px;text-align:left;width:100%;border-top:1px solid var(--line);padding-top:10px}
.cf-colitem{font-size:.85em;margin-bottom:5px;color:var(--tx2)}
.cf-colitem b{color:var(--tx);font-weight:700}
.cf-ex{font-size:.83em;color:var(--tx2);line-height:1.6;text-align:left;width:100%;margin-top:8px}
.cf-hint{font-size:.74em;color:var(--tx3);margin-top:10px}
.fcrow{display:flex;gap:8px;margin-top:12px}
.fcrow .btn{margin-top:0}
.navrow{display:flex;gap:8px;margin-top:9px}
.navrow .btn{margin-top:0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:.8em;color:var(--tx2)}
.chk input{width:15px;height:15px}
.foot{text-align:center;color:var(--tx3);font-size:.72em;padding:20px 0 10px;line-height:1.7}
</style>
</head>

<script>
(function(){
"use strict";
var WORDS = (DATA && DATA.words) ? DATA.words : [];
var PAGES = Array.from(new Set(WORDS.map(function(w){return w.page;}).filter(function(p){return p!=null;}))).sort(function(a,b){return a-b;});

var state = { screen:'list', page:'all', search:'' };

function $(sel,root){ return (root||document).querySelector(sel); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function keyOf(w){ return (w.word||'').trim().toLowerCase()+'||'+(w.pos||'').trim().toLowerCase(); }

function pageMatch(w, page){ return page==='all' || String(w.page)===String(page); }
function filteredByPage(page){ return WORDS.filter(function(w){ return w.word && pageMatch(w,page); }); }

/* ---------- localStorage helpers ---------- */
function lsGet(key, fallback){
  try{ var v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; }
}
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function wrongKey(){ return 'quiz5_wrong'; }
function loadWrong(){ return lsGet(wrongKey(), []); }
function addWrong(w){ var a=loadWrong(); var k=keyOf(w); if(a.indexOf(k)<0){ a.push(k); lsSet(wrongKey(),a);} }
function removeWrong(w){ var a=loadWrong(); var k=keyOf(w); var i=a.indexOf(k); if(i>=0){ a.splice(i,1); lsSet(wrongKey(),a);} }
function isWrong(w){ return loadWrong().indexOf(keyOf(w))>=0; }
function anyWrong(){ return loadWrong().length>0; }

function fcKey(){ return 'quiz5_fc_status'; }
function loadFc(){ return lsGet(fcKey(), {}); }
function setFc(w,status){ var o=loadFc(); o[keyOf(w)]=status; lsSet(fcKey(),o); }
function getFc(w){ var o=loadFc(); return o[keyOf(w)]||null; }

/* ---------- global distractor pools (built once, from the real dataset) ---------- */
var ALL_COLS = []; /* {en, zh} unique */
(function(){
  var seen={};
  WORDS.forEach(function(w){
    (w.collocations||[]).forEach(function(c){
      if(!c || !c.en) return;
      var k=c.en.trim().toLowerCase();
      if(seen[k]) return; seen[k]=1;
      ALL_COLS.push({en:c.en, zh:c.zh||''});
    });
  });
})();
var ALL_PHRASES = []; /* union of example answers + collocation ens, for cloze distractors */
(function(){
  var seen={};
  function add(s){ if(!s) return; var k=s.trim().toLowerCase(); if(seen[k]) return; seen[k]=1; ALL_PHRASES.push(s); }
  WORDS.forEach(function(w){
    (w.examples||[]).forEach(function(e){ if(e && e.answer) add(e.answer); });
    (w.collocations||[]).forEach(function(c){ if(c && c.en) add(c.en); });
  });
})();

function pickDistinct(pool, excludeVal, count, textOf){
  var seen={}; seen[(excludeVal||'').trim().toLowerCase()]=1;
  var cands = shuffle(pool.slice());
  var out=[];
  for(var i=0;i<cands.length && out.length<count;i++){
    var t = textOf(cands[i]);
    if(!t) continue;
    var k=t.trim().toLowerCase();
    if(seen[k]) continue;
    seen[k]=1; out.push(cands[i]);
  }
  return out;
}

function makeOptions(correctText, distractorTexts){
  var opts = [correctText].concat(distractorTexts);
  shuffle(opts);
  return opts;
}

/* ---------- quiz building ---------- */
function buildQuestions(wrongOnly){
  var pool = filteredByPage(state.page);
  var qs = [];
  pool.forEach(function(w){
    if(wrongOnly && !isWrong(w)) return;
    if(w.zh){
      qs.push({ type:'meaning2word', word:w });
      qs.push({ type:'word2meaning', word:w });
    }
    (w.collocations||[]).forEach(function(c){
      if(c && c.en && c.zh) qs.push({ type:'colloc', word:w, col:c });
    });
    (w.examples||[]).forEach(function(e){
      if(e && e.en && e.answer && e.en.indexOf(e.answer)>=0) qs.push({ type:'cloze', word:w, ex:e });
    });
  });
  shuffle(qs);
  qs.forEach(function(q){
    if(q.type==='meaning2word'){
      var d1 = pickDistinct(WORDS, q.word.word, 3, function(x){ return x.word; });
      q.options = makeOptions(q.word.word, d1.map(function(x){return x.word;}));
    } else if(q.type==='word2meaning'){
      var d2 = pickDistinct(WORDS, q.word.zh, 3, function(x){ return x.zh; });
      q.options = makeOptions(q.word.zh, d2.map(function(x){return x.zh;}));
    } else if(q.type==='colloc'){
      var d3 = pickDistinct(ALL_COLS, q.col.en, 3, function(x){ return x.en; });
      q.options = makeOptions(q.col.en, d3.map(function(x){return x.en;}));
    } else if(q.type==='cloze'){
      var d4 = pickDistinct(ALL_PHRASES, q.ex.answer, 3, function(x){ return x; });
      q.options = makeOptions(q.ex.answer, d4);
    }
  });
  return qs.filter(function(q){ return q.options && q.options.length>=2; });
}

/* ---------- flashcard building ---------- */
function buildDeck(unsureOnly){
  var list = filteredByPage(state.page);
  if(unsureOnly){ list = list.filter(function(w){ return getFc(w)==='unsure'; }); }
  return list;
}

/* ---------- shared topbar ---------- */
function renderTopbar(){
  return '<div class="topbar"><div class="ttl">GSAT 單字 P124-128</div>'+
    '<div class="menuwrap"><button class="menubtn" id="menuBtn" aria-label="選單">⋯</button>'+
    '<div class="menudrop" id="menuDrop" hidden>'+
      '<button class="mitem" data-act="start-quiz" data-mode="all">📝 選擇題（全部）</button>'+
      '<button class="mitem" data-act="start-quiz" data-mode="wrong">🔁 選擇題（只練錯的）</button>'+
      '<button class="mitem" data-act="start-cards">🃏 字卡</button>'+
      '<button class="mitem" data-act="home">📋 回單字清單</button>'+
    '</div></div></div>';
}

/* ---------- render: router ---------- */
function render(){
  var app = $('#app');
  if(state.screen==='quiz') app.innerHTML = renderTopbar()+renderQuiz();
  else if(state.screen==='result') app.innerHTML = renderTopbar()+renderResult();
  else if(state.screen==='cards') app.innerHTML = renderTopbar()+renderCards();
  else app.innerHTML = renderTopbar()+renderList();
  bind();
}

function collocLine(c){
  return '<div class="sub">▸ <b>'+esc(c.en)+'</b>　'+esc(c.zh||'')+'</div>';
}
function exampleLine(e){
  var en=e.en||'', ans=e.answer||'';
  var i = ans ? en.indexOf(ans) : -1;
  var html;
  if(i>=0){ html = esc(en.slice(0,i))+'<b>'+esc(ans)+'</b>'+esc(en.slice(i+ans.length)); }
  else { html = esc(en); }
  return '<div class="sub">e.g. '+html+'</div>';
}

function renderList(){
  var chips = ['<button class="chip'+(state.page==='all'?' on':'')+'" data-act="setpage" data-page="all">全部</button>'].concat(
    PAGES.map(function(p){
      return '<button class="chip'+(String(state.page)===String(p)?' on':'')+'" data-act="setpage" data-page="'+p+'">'+p+'</button>';
    })
  ).join('');
  var list = filteredByPage(state.page);
  var cells = list.map(function(w){
    var hay = ((w.word||'')+' '+(w.zh||'')).toLowerCase();
    var subs = (w.collocations||[]).map(collocLine).join('') + (w.examples||[]).map(exampleLine).join('') +
      (w.note ? '<div class="sub">'+esc(w.note)+'</div>' : '');
    return '<div class="wcell" data-hay="'+esc(hay)+'">'+
      '<b>'+esc(w.word)+'</b><span class="pg">p.'+esc(w.page)+'</span>'+
      '<span class="ipa">'+esc(w.phonetic||'')+' <span class="pos">'+esc(w.pos||'')+'</span></span>'+
      '<div class="zh">'+esc(w.zh||'')+'</div>'+ subs +
      '</div>';
  }).join('');
  return ''+
  '<p class="sub" style="margin-top:0">共 '+WORDS.length+' 個單字・GSAT/AST GLOSSARY 2015-2026 PART II p124-128</p>'+
  '<input class="searchbox" id="searchBox" type="search" placeholder="搜尋單字或中文意思…" value="'+esc(state.search)+'">'+
  '<div class="chiprow">'+chips+'</div>'+
  '<div class="lab">單字清單（'+list.length+'）</div>'+
  '<div class="wgrid" id="wgrid">'+(cells||'<div class="empty">目前沒有資料</div>')+'</div>';
}

var TYPE_TAG = { meaning2word:'中文 → 英文', word2meaning:'英文 → 中文', colloc:'搭配詞', cloze:'例句挖空' };

function questionPrompt(cur){
  if(cur.type==='meaning2word'){
    return esc(cur.word.zh) + (cur.word.pos ? '（'+esc(cur.word.pos)+'）' : '');
  }
  if(cur.type==='word2meaning'){
    return esc(cur.word.word) + (cur.word.phonetic ? '<span class="ipa2">'+esc(cur.word.phonetic)+'</span>' : '');
  }
  if(cur.type==='colloc'){
    return esc(cur.col.zh);
  }
  if(cur.type==='cloze'){
    var en=cur.ex.en, ans=cur.ex.answer, i=en.indexOf(ans);
    return esc(en.slice(0,i)) + '<u>_____</u>' + esc(en.slice(i+ans.length));
  }
  return '';
}
function correctAnswer(cur){
  if(cur.type==='meaning2word') return cur.word.word;
  if(cur.type==='word2meaning') return cur.word.zh;
  if(cur.type==='colloc') return cur.col.en;
  if(cur.type==='cloze') return cur.ex.answer;
  return '';
}

function renderQuiz(){
  var q = state.quiz;
  if(!q) return renderList();
  if(q.qs.length===0){
    return '<button class="back" data-act="home">← 回單字清單</button>'+
      '<div class="card empty">目前沒有可以出的題目'+(q.wrongOnly?'（沒有錯題了，太厲害了）':'')+'</div>';
  }
  if(q.idx>=q.qs.length){ state.screen='result'; return renderResult(); }
  var cur = q.qs[q.idx];
  var pct = Math.round(q.idx/q.qs.length*100);
  var correct = correctAnswer(cur);
  var answered = !!cur.answered;
  var optsHtml = cur.options.map(function(opt){
    var cls = 'opt';
    if(answered){
      if(opt===correct) cls += ' good';
      else if(opt===cur.selected) cls += ' bad';
    }
    return '<button class="'+cls+'" data-act="pick" data-opt="'+esc(opt)+'"'+(answered?' disabled':'')+'>'+esc(opt)+'</button>';
  }).join('');
  var fb = '';
  if(answered){
    var ok = cur.selected===correct;
    var w = cur.word;
    var extra = '';
    if(cur.type==='colloc'){
      extra = '<div class="exsent"><b>'+esc(cur.col.en)+'</b>　'+esc(cur.col.zh||'')+'</div>';
    } else if(cur.type==='cloze'){
      var en2=cur.ex.en, ans2=cur.ex.answer, i2=en2.indexOf(ans2);
      extra = '<div class="exsent">'+esc(en2.slice(0,i2))+'<b>'+esc(ans2)+'</b>'+esc(en2.slice(i2+ans2.length))+'</div>';
    }
    fb = '<div class="fb '+(ok?'good':'bad')+'">'+
      '<div class="hd">'+(ok?'答對了 🎉':'答錯了')+'</div>'+
      '<div class="ansbox"><span class="answ">'+esc(w.word)+'</span><span class="ipa2">'+esc(w.phonetic||'')+'</span>'+
      '<div class="zh2">'+esc(w.zh||'')+'</div>'+ extra +
      '</div></div>'+
      '<button class="btn" data-act="next">'+(q.idx+1>=q.qs.length?'看結果':'下一題')+'</button>';
  }
  return ''+
  '<button class="back" data-act="home">← 回單字清單</button>'+
  '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
  '<div class="pmeta"><span>第 '+(q.idx+1)+' / '+q.qs.length+' 題</span><span>答對 '+q.score+'</span></div>'+
  '<div class="card">'+
    '<div class="qtag">'+esc(TYPE_TAG[cur.type]||'')+'</div>'+
    '<div class="qmain">'+questionPrompt(cur)+'</div>'+
    '<div class="opts">'+optsHtml+'</div>'+
  '</div>'+
  fb;
}

function renderResult(){
  var q = state.quiz;
  if(!q) return renderList();
  return ''+
  '<button class="back" data-act="home">← 回單字清單</button>'+
  '<div class="card score"><div class="n">'+q.score+' / '+q.qs.length+'</div><div class="d">答對題數</div></div>'+
  '<button class="btn" data-act="start-quiz" data-mode="'+(q.wrongOnly?'wrong':'all')+'">再玩一次</button>'+
  '<button class="btn ghost" data-act="home">回單字清單</button>';
}

function renderCards(){
  var c = state.cards;
  if(!c) return renderList();
  var list = c.list;
  var head = '<button class="back" data-act="home">← 回單字清單</button>'+
    '<div class="toprow"><h1 style="margin:0;font-size:1.05em">字卡</h1>'+
    '<label class="chk"><input type="checkbox" id="unsureOnly"'+(c.unsureOnly?' checked':'')+'> 只看還不熟</label></div>';
  if(list.length===0){
    return head+'<div class="card empty">沒有卡片可以看</div>';
  }
  if(c.idx>=list.length) c.idx=0;
  var w = list[c.idx];
  var status = getFc(w);
  var body;
  if(!c.flipped){
    body = '<div class="cf-word">'+esc(w.word)+'</div><div class="cf-ipa">'+esc(w.phonetic||'')+'</div>'+
      '<div class="cf-hint">點卡片看解釋</div>';
  } else {
    var colHtml = '';
    if((w.collocations||[]).length){
      colHtml = '<div class="cf-col">'+w.collocations.map(function(c2){
        return '<div class="cf-colitem"><b>'+esc(c2.en)+'</b>　'+esc(c2.zh||'')+'</div>';
      }).join('')+'</div>';
    }
    var exHtml = '';
    if((w.examples||[]).length){
      exHtml = '<div class="cf-ex">'+w.examples.map(exampleLine).join('')+'</div>';
    }
    body = '<div class="cf-pos">'+esc(w.pos||'')+'</div>'+
      '<div class="cf-word" style="font-size:1.25em">'+esc(w.word)+'<span class="cf-ipa" style="display:inline">'+esc(w.phonetic||'')+'</span></div>'+
      '<div class="cf-zh">'+esc(w.zh||'')+'</div>'+ colHtml + exHtml;
  }
  return head+
  '<div class="pmeta"><span>'+(c.idx+1)+' / '+list.length+'</span><span>'+(status==='know'?'✅ 我會了':(status==='unsure'?'🟡 還不熟':''))+'</span></div>'+
  '<div class="cardbox" data-act="flip">'+body+'</div>'+
  '<div class="fcrow">'+
    '<button class="btn ghost" data-act="mark" data-status="unsure">還不熟</button>'+
    '<button class="btn" data-act="mark" data-status="know">我會了</button>'+
  '</div>'+
  '<div class="navrow">'+
    '<button class="btn ghost" data-act="prev">◀ 上一張</button>'+
    '<button class="btn ghost" data-act="shuffle">🔀 洗牌</button>'+
    '<button class="btn ghost" data-act="nextcard">下一張 ▶</button>'+
  '</div>';
}

/* ---------- actions ---------- */
function startQuiz(mode){
  var wrongOnly = mode==='wrong' && anyWrong();
  state.quiz = { qs:buildQuestions(wrongOnly), idx:0, score:0, wrongOnly:wrongOnly };
  state.screen = 'quiz';
}
function startCards(){
  state.cards = { list: buildDeck(false), idx:0, flipped:false, unsureOnly:false };
  state.screen = 'cards';
}

function closeMenu(){ var d=document.getElementById('menuDrop'); if(d) d.hidden=true; }

function bind(){
  var app = $('#app');
  app.onclick = function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    var act = t.getAttribute('data-act');
    if(act==='home'){ closeMenu(); state.screen='list'; render(); }
    else if(act==='start-quiz'){ closeMenu(); startQuiz(t.getAttribute('data-mode')); render(); }
    else if(act==='start-cards'){ closeMenu(); startCards(); render(); }
    else if(act==='setpage'){ state.page = t.getAttribute('data-page'); render(); }
    else if(act==='pick'){
      var q = state.quiz; var cur = q.qs[q.idx];
      if(cur.answered) return;
      var opt = t.getAttribute('data-opt');
      cur.answered = true; cur.selected = opt;
      var correct = correctAnswer(cur);
      var ok = opt===correct;
      if(ok){ q.score++; removeWrong(cur.word); }
      else { addWrong(cur.word); }
      render();
    }
    else if(act==='next'){ state.quiz.idx++; render(); }
    else if(act==='flip'){ state.cards.flipped = !state.cards.flipped; render(); }
    else if(act==='mark'){
      var c = state.cards; var w = c.list[c.idx];
      var status = t.getAttribute('data-status');
      setFc(w, status);
      if(status==='unsure'){ addWrong(w); } else { removeWrong(w); }
      c.flipped = false;
      c.idx = Math.min(c.idx+1, Math.max(0,c.list.length-1));
      render();
    }
    else if(act==='prev'){ var c2=state.cards; c2.idx=Math.max(0,c2.idx-1); c2.flipped=false; render(); }
    else if(act==='nextcard'){ var c3=state.cards; c3.idx=Math.min(c3.list.length-1,c3.idx+1); c3.flipped=false; render(); }
    else if(act==='shuffle'){ shuffle(state.cards.list); state.cards.idx=0; state.cards.flipped=false; render(); }
  };
  var menuBtn = $('#menuBtn', app);
  if(menuBtn){ menuBtn.onclick = function(e){ e.stopPropagation(); var d=$('#menuDrop',app); d.hidden = !d.hidden; }; }
  var searchBox = $('#searchBox', app);
  if(searchBox){
    searchBox.oninput = function(){
      state.search = searchBox.value;
      var q = state.search.trim().toLowerCase();
      var grid = $('#wgrid', app);
      if(!grid) return;
      var cells = grid.querySelectorAll('.wcell');
      for(var i=0;i<cells.length;i++){
        var hay = cells[i].getAttribute('data-hay')||'';
        cells[i].hidden = !!q && hay.indexOf(q)<0;
      }
    };
  }
  var unsureChk = $('#unsureOnly', app);
  if(unsureChk){ unsureChk.onchange = function(){
    var c = state.cards; c.unsureOnly = unsureChk.checked;
    c.list = buildDeck(c.unsureOnly); c.idx=0; c.flipped=false; render();
  }; }
}

document.addEventListener('click', function(e){
  var d = document.getElementById('menuDrop');
  if(d && !d.hidden){
    if(!d.contains(e.target) && e.target.id!=='menuBtn'){ d.hidden = true; }
  }
});

render();
})();
</script>
