<title>單字總表</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f8;--card:#fff;--fg:#1c1c1e;--tx2:#4a4a52;--tx3:#8a8a92;--line:#e2e2e8;--acc:#7c5cff}
@media(prefers-color-scheme:dark){:root{--bg:#141418;--card:#1d1d22;--fg:#f2f2f5;--tx2:#c6c6cf;--tx3:#8f8f99;--line:#2e2e36;--acc:#a48fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 12px 70px}
header{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:5;border-bottom:1px solid var(--line)}
#q{width:100%;font-size:17px;padding:10px 13px;border:2px solid var(--line);border-radius:11px;background:var(--card);color:var(--fg);outline:none}
#q:focus{border-color:var(--acc)}
#tabs{display:flex;gap:7px;padding:9px 0 2px}
#tabs button{flex:1;font-size:15px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#c{font-size:12.5px;color:var(--tx3);padding-top:4px}
.wlist{margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px 9px;font-size:.86em;min-width:0}
.wrow b{font-weight:750;font-size:1.05em;word-break:break-word}
.wrow .ps{color:var(--tx3);font-size:.78em;margin-left:5px;font-weight:400}
.wrow .zh{font-size:.9em;line-height:1.45;color:var(--tx2);margin-top:3px;overflow-wrap:break-word;word-break:break-word}
.wlist .pgbrk{grid-column:1/-1;margin:12px 0 1px;color:var(--tx3);font-size:.82em;font-weight:650;letter-spacing:.4px}
.wlist .pgbrk:first-child{margin-top:2px}
mark{background:#ffe066;color:#000;border-radius:3px}
.empty{color:var(--tx3);text-align:center;padding:26px 0;font-size:15px}
.foot{text-align:center;color:var(--tx3);font-size:12px;padding:20px 0 6px;line-height:1.7}
</style></head><body>
