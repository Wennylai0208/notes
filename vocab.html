#c{font-size:14px;color:var(--sub);padding-top:4px}
main{padding:8px 12px 60px}
.r{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.w{font-size:21px;font-weight:700;word-break:break-word}
.p{font-size:15px;color:var(--acc);margin-left:8px;font-weight:400}
.z{margin-top:2px;word-break:break-word}
.t{margin-top:4px}
.t span{display:inline-block;font-size:13px;color:var(--sub);background:var(--chip);border-radius:8px;padding:1px 8px;margin-right:6px}
mark{background:#ffe066;color:#000;border-radius:3px}
.e{text-align:center;color:var(--sub);padding:40px}
