<style>
:root{color-scheme:light dark;--bg:#fafafa;--fg:#1c1c1e;--sub:#6b6b70;--card:#fff;--line:#e3e3e8;--acc:#7c5cff;--chip:#eee;--pg:#eef0ff;--pgf:#4b3bb5}
@media(prefers-color-scheme:dark){:root{--bg:#111114;--fg:#f2f2f5;--sub:#9a9aa3;--card:#1c1c21;--line:#2c2c33;--acc:#a48fff;--chip:#2a2a31;--pg:#2b2a45;--pgf:#c3b6ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line);z-index:5}
#q{width:100%;font-size:18px;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}
#q:focus{border-color:var(--acc)}
#f{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#f::-webkit-scrollbar{display:none}
#f button{flex:none;font-size:15px;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--chip);color:var(--fg)}
#f button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#c{font-size:13px;color:var(--sub);padding-top:3px}
main{padding:6px 12px 70px}
.r{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 2px}
.l{flex:1;min-width:0}
.w{font-size:18px;font-weight:700;word-break:break-word}
.p{font-size:13px;color:var(--sub);margin-left:6px;font-weight:400}
.z{font-size:15px;color:var(--sub);margin-top:2px;word-break:break-word}
.t{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.t span{font-size:12px;background:var(--pg);color:var(--pgf);border-radius:6px;padding:2px 7px;white-space:nowrap}
mark{background:#ffe066;color:#000;border-radius:3px}
.e{color:var(--sub);text-align:center;padding:24px 0;font-size:15px}
</style></head><body>
