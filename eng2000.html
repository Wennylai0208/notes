<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>國中英單2000</title>
<style>
  :root{
    --bg:#fdf7f0; --card:#ffffff; --primary:#ff9f68; --primary-dark:#f2793d;
    --accent:#6fcf97; --accent2:#5b8def; --text:#3a3a3a; --sub:#8a8a8a;
    --danger:#f26d6d; --border:#f0e4d8; --shadow:0 4px 14px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:"PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color: transparent; padding-bottom:40px;
  }
  #app{max-width:520px;margin:0 auto;padding:16px;}
  h1.top-title{font-size:22px;text-align:center;margin:8px 0 4px;color:var(--primary-dark);}
  p.top-sub{text-align:center;color:var(--sub);font-size:13px;margin:0 0 16px;}
  .nav-bar{display:flex;gap:8px;margin-bottom:14px;}
  .nav-btn{flex:1;padding:10px 6px;border:none;border-radius:14px;background:var(--card);
    box-shadow:var(--shadow);font-size:14px;color:var(--text);font-weight:bold;}
  .nav-btn.active{background:var(--primary);color:#fff;}
  .chapter{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;}
  .chapter-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .chapter-head:active{background:#fff3e6;}
  .chapter-name{font-size:16px;font-weight:bold;}
  .chapter-meta{font-size:12px;color:var(--sub);}
  .chapter-arrow{font-size:14px;color:var(--sub);transition:transform .2s;}
  .unit-list{border-top:1px solid var(--border);}
  .unit-row{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--border);}
  .unit-row:last-child{border-bottom:none;}
  .unit-row:active{background:#fff8f0;}
  .unit-left{flex:1;min-width:0;}
  .unit-name{font-size:14px;font-weight:bold;}
  .unit-name-en{font-size:11px;color:var(--sub);}
  .unit-right{text-align:right;font-size:11px;color:var(--sub);min-width:64px;}
  .badge-ready{color:var(--accent2);font-weight:bold;}
  .badge-empty{color:#c9bdae;}
  .progress-mini{height:5px;border-radius:3px;background:#eee2d2;margin-top:4px;overflow:hidden;}
  .progress-mini-fill{height:100%;background:var(--accent);}
  .card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:16px;font-size:17px;font-weight:bold;
    background:var(--primary);color:#fff;margin-bottom:12px;box-shadow:var(--shadow);}
  .btn:active{transform:scale(0.97);background:var(--primary-dark);}
  .btn.secondary{background:var(--accent2);}
  .btn.outline{background:#fff;color:var(--primary-dark);border:2px solid var(--primary);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:10px;font-size:14px;}
  .back-btn{background:none;border:none;color:var(--primary-dark);font-size:15px;font-weight:bold;
    margin-bottom:10px;padding:6px 0;}
  .flash-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);min-height:280px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:24px;margin-bottom:16px;border:3px solid var(--border);}
  .flash-word{font-size:32px;font-weight:bold;color:var(--primary-dark);margin-bottom:8px;word-break:break-word;}
  .flash-kk{font-size:16px;color:var(--sub);margin-bottom:14px;}
  .flash-pos{display:inline-block;background:#fff0e0;color:var(--primary-dark);padding:3px 10px;
    border-radius:10px;font-size:12px;margin-bottom:14px;}
  .flash-zh{font-size:26px;font-weight:bold;margin-bottom:10px;}
  .flash-sen{font-size:14px;color:var(--text);margin-top:14px;line-height:1.6;text-align:left;
    background:#faf3ea;border-radius:12px;padding:10px 12px;}
  .flash-sen-zh{color:var(--sub);margin-top:4px;}
  .speak-btn{background:var(--accent2);color:#fff;border:none;border-radius:50%;width:44px;height:44px;
    font-size:18px;margin:0 4px;box-shadow:var(--shadow);}
  .speak-btn.small2{width:34px;height:34px;font-size:14px;}
  .hint{color:var(--sub);font-size:12px;text-align:center;margin-bottom:10px;}
  .flash-nav{display:flex;gap:10px;margin-bottom:10px;}
  .flash-nav .btn{margin-bottom:0;}
  .know-row{display:flex;gap:10px;margin-top:6px;}
  .quiz-q{font-size:24px;font-weight:bold;text-align:center;margin:20px 0 6px;}
  .quiz-sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px;}
  .choice-btn{display:block;width:100%;padding:14px;border:2px solid var(--border);border-radius:14px;
    background:#fff;font-size:16px;margin-bottom:10px;text-align:left;}
  .choice-btn.correct{border-color:var(--accent);background:#eafaf0;color:#2f8f5b;font-weight:bold;}
  .choice-btn.wrong{border-color:var(--danger);background:#fdeaea;color:#c0392b;font-weight:bold;}
  .progress-bar-wrap{background:#eee2d2;border-radius:8px;height:10px;overflow:hidden;margin:10px 0 16px;}
  .progress-bar-fill{background:var(--accent);height:100%;}
  .stat-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px;}
  .center-icon{font-size:48px;text-align:center;margin:20px 0;}
  .empty-box{background:var(--card);border-radius:18px;padding:30px 20px;text-align:center;box-shadow:var(--shadow);}
  .empty-box .em{font-size:44px;margin-bottom:12px;}
  .mistake-item{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);
    display:flex;justify-content:space-between;align-items:center;}
  .mistake-word{font-weight:bold;font-size:16px;}
  .mistake-zh{color:var(--sub);font-size:13px;}
  .footer-note{text-align:center;color:#c9bdae;font-size:11px;margin-top:24px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a3a3a;color:#fff;
    padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;}
  .toast.show{opacity:0.95;}
  .center-txt{text-align:center;}
  .unit-title-big{font-size:20px;font-weight:bold;margin-bottom:2px;}
  .unit-title-en{color:var(--sub);font-size:13px;margin-bottom:14px;}
</style>
</head>

// ---------- localStorage ----------
const LS_PROGRESS = "zh_vocab_progress_v1";
const LS_MISTAKE = "zh_vocab_mistakes_v1";
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(LS_PROGRESS))||{}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(LS_PROGRESS, JSON.stringify(p)); }catch(e){} }
function loadMistakes(){ try{ return JSON.parse(localStorage.getItem(LS_MISTAKE))||{}; }catch(e){ return {}; } }
function saveMistakes(m){ try{ localStorage.setItem(LS_MISTAKE, JSON.stringify(m)); }catch(e){} }
function wordKey(w){ return w.u + "|" + w.word; }

function markLearned(w){
  const p = loadProgress();
  p[wordKey(w)] = true;
  saveProgress(p);
}
function addMistake(w){
  const m = loadMistakes();
  m[wordKey(w)] = (m[wordKey(w)]||0) + 1;
  saveMistakes(m);
}
function removeMistake(w){
  const m = loadMistakes();
  delete m[wordKey(w)];
  saveMistakes(m);
}
function unitProgressPct(u){
  const list = WORDS_BY_UNIT[u];
  if(!list || list.length===0) return 0;
  const p = loadProgress();
  let learned = 0;
  list.forEach(w=>{ if(p[wordKey(w)]) learned++; });
  return Math.round(learned/list.length*100);
}

// ---------- 發音 ----------
function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) { toast("這個瀏覽器不支援發音功能"); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>{ t.classList.remove('show'); }, 1600);
}

// ---------- 字卡模式 ----------
function startFlashcard(uno){
  currentUnit = uno;
  flashIndex = 0;
  flashFlipped = false;
  renderFlashcard();
}
function renderFlashcard(){
  const words = WORDS_BY_UNIT[currentUnit];
  const w = words[flashIndex];
  const p = loadProgress();
  const learned = !!p[wordKey(w)];
  let html = '<button class="back-btn" onclick="renderUnitMenu(currentUnit)">← 返回單元</button>';
  html += `<div class="hint">字卡 ${flashIndex+1} / ${words.length}${learned?'　✅已會':''}</div>`;
  html += '<div class="flash-card" onclick="flipCard()">';
  if(!flashFlipped){
    html += `<div class="flash-word">${esc(w.word)}</div>`;
    html += `<div class="flash-kk">${esc(w.kk)}</div>`;
    html += `<div class="flash-pos">${esc(w.pos)}</div>`;
    html += `<button class="speak-btn" onclick='event.stopPropagation();speak(${JSON.stringify(w.word)},"en-US")'>🔊</button>`;
    html += '<div class="hint" style="margin-top:14px;">點卡片看中文解釋</div>';
  } else {
    html += `<div class="flash-zh">${esc(w.zh)}</div>`;
    html += `<div class="flash-pos">${esc(w.pos)}</div>`;
    html += '<div class="flash-sen">';
    html += `${esc(w.sen_en)} <button class="speak-btn small2" onclick='event.stopPropagation();speak(${JSON.stringify(w.sen_en)},"en-US")'>🔊</button>`;
    html += `<div class="flash-sen-zh">${esc(w.sen_zh)}</div>`;
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="flash-nav">';
  html += `<button class="btn outline small" style="flex:1" onclick="flashPrev()" ${flashIndex===0?'disabled':''}>⬅ 上一個</button>`;
  html += `<button class="btn outline small" style="flex:1" onclick="flashNext()">下一個 ➡</button>`;
  html += '</div>';
  html += '<div class="know-row">';
  html += `<button class="btn secondary small" style="flex:1" onclick="markKnow(true)">😀 我會了</button>`;
  html += `<button class="btn danger small" style="flex:1" onclick="markKnow(false)">🤔 還不熟</button>`;
  html += '</div>';
  render(html);
}
function flipCard(){ flashFlipped = !flashFlipped; renderFlashcard(); }
function flashNext(){
  const words = WORDS_BY_UNIT[currentUnit];
  flashFlipped = false;
  flashIndex = (flashIndex+1) % words.length;
  renderFlashcard();
}
function flashPrev(){
  if(flashIndex===0) return;
  flashFlipped = false;
  flashIndex -= 1;
  renderFlashcard();
}
function markKnow(know){
  const words = WORDS_BY_UNIT[currentUnit];
  const w = words[flashIndex];
  if(know){ markLearned(w); removeMistake(w); toast('太棒了，已標記學會！'); }
  else { addMistake(w); toast('已加入錯題本，晚點再複習～'); }
  flashNext();
}

// ---------- 中翻英四選一測驗 ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function startQuizC2E(uno){
  currentUnit = uno;
  quizQueue = shuffle(WORDS_BY_UNIT[uno]);
  quizIndex = 0;
  quizScore = {right:0, wrong:0};
  renderQuizC2E();
}
function buildChoices(correctWord, pool, field){
  const others = pool.filter(x=>x.word!==correctWord.word);
  const wrongs = shuffle(others).slice(0,3);
  const choices = shuffle([correctWord, ...wrongs]);
  return choices;
}
let currentChoices = [];
function renderQuizC2E(){
  const words = WORDS_BY_UNIT[currentUnit];
  if(quizIndex >= quizQueue.length){ renderQuizResult('中翻英測驗'); return; }
  const w = quizQueue[quizIndex];
  currentChoices = buildChoices(w, words);
  quizAnswered = false;
  let html = '<button class="back-btn" onclick="renderUnitMenu(currentUnit)">← 返回單元</button>';
  html += `<div class="hint">中翻英測驗　第 ${quizIndex+1} / ${quizQueue.length} 題</div>`;
  html += `<div class="quiz-q">${esc(w.zh)}</div>`;
  html += `<div class="quiz-sub">請選出正確的英文單字（${esc(w.pos)}）</div>`;
  html += '<div id="choiceBox">';
  currentChoices.forEach((c,idx)=>{
    html += `<button class="choice-btn" id="c2e_${idx}" onclick="answerC2E(${idx})">${esc(c.word)}</button>`;
  });
  html += '</div>';
  render(html);
}
function answerC2E(idx){
  if(quizAnswered) return;
  quizAnswered = true;
  const w = quizQueue[quizIndex];
  const chosen = currentChoices[idx];
  const correctIdx = currentChoices.findIndex(c=>c.word===w.word);
  document.getElementById('c2e_'+correctIdx).classList.add('correct');
  if(chosen.word === w.word){
    quizScore.right++;
    markLearned(w); removeMistake(w);
    toast('答對了！');
  } else {
    quizScore.wrong++;
    document.getElementById('c2e_'+idx).classList.add('wrong');
    addMistake(w);
    toast('答錯了，已加入錯題本');
  }
  setTimeout(()=>{ quizIndex++; renderQuizC2E(); }, 900);
}

function startListening(uno){
  currentUnit = uno;
  quizQueue = shuffle(WORDS_BY_UNIT[uno]);

function renderListening(){
  const words = WORDS_BY_UNIT[currentUnit];
  if(quizIndex >= quizQueue.length){ renderQuizResult('聽發音選單字'); return; }
  const w = quizQueue[quizIndex];
  currentChoices = buildChoices(w, words);
  quizAnswered = false;
  let html = '<button class="back-btn" onclick="renderUnitMenu(currentUnit)">← 返回單元</button>';
  html += `<div class="hint">聽發音選單字　第 ${quizIndex+1} / ${quizQueue.length} 題</div>`;
  html += '<div class="card center-txt">';
  html += `<button class="speak-btn" style="width:70px;height:70px;font-size:28px;" onclick='speak(${JSON.stringify(w.word)},"en-US")'>🔊</button>`;
  html += '<div class="hint" style="margin-top:10px;">點喇叭聽發音，選出正確的中文意思</div>';
  html += '</div>';
  html += '<div id="choiceBox">';
  currentChoices.forEach((c,idx)=>{
    html += `<button class="choice-btn" id="lis_${idx}" onclick="answerListening(${idx})">${esc(c.zh)}</button>`;
  });
  html += '</div>';
  render(html);
  speak(w.word, 'en-US');
}
function answerListening(idx){
  if(quizAnswered) return;
  quizAnswered = true;
  const w = quizQueue[quizIndex];
  const chosen = currentChoices[idx];
  const correctIdx = currentChoices.findIndex(c=>c.word===w.word);
  document.getElementById('lis_'+correctIdx).classList.add('correct');
  if(chosen.word === w.word){
    quizScore.right++;
    markLearned(w); removeMistake(w);
    toast('答對了！');
  } else {
    quizScore.wrong++;
    document.getElementById('lis_'+idx).classList.add('wrong');
    addMistake(w);
    toast('答錯了，已加入錯題本');
  }
  setTimeout(()=>{ quizIndex++; renderListening(); }, 900);
}

function renderQuizResult(title){
  const total = quizScore.right + quizScore.wrong;
  const pct = total>0 ? Math.round(quizScore.right/total*100) : 0;
  let html = '<button class="back-btn" onclick="renderUnitMenu(currentUnit)">← 返回單元</button>';
  html += '<div class="card center-txt">';
  html += '<div class="center-icon">🎉</div>';
  html += `<div class="unit-title-big">${esc(title)}結束！</div>`;
  html += `<div class="stat-row"><span>答對：${quizScore.right}</span><span>答錯：${quizScore.wrong}</span></div>`;
  html += `<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
  html += `<p>正確率 ${pct}%</p>`;
  html += '</div>';
  html += `<button class="btn" onclick="renderUnitMenu(currentUnit)">回單元選單</button>`;
  html += `<button class="btn outline" onclick="goHome()">回章節目錄</button>`;
  render(html);
}

// ---------- 錯題本 ----------
function goMistakeBook(){
  currentUnit = null;
  const m = loadMistakes();
  const keys = Object.keys(m);
  let html = '<h1 class="top-title">📖 國中英單 2000</h1>';
  html += '<div class="nav-bar">';
  html += '<button class="nav-btn" onclick="goHome()">章節目錄</button>';
  html += '<button class="nav-btn active" onclick="goMistakeBook()">錯題本</button>';
  html += '</div>';
  if(keys.length===0){
    html += '<div class="empty-box"><div class="em">🌟</div><p>目前沒有錯題，太棒了！</p></div>';
    render(html);
    return;
  }
  html += `<p class="hint">共 ${keys.length} 個錯題，點單字可以聽發音、複習例句</p>`;
  keys.forEach(k=>{
    const [u, word] = k.split('|');
    const list = WORDS_BY_UNIT[u] || [];
    const w = list.find(x=>x.word===word);
    if(!w) return;
    html += `<div class="mistake-item">`;
    html += `<div onclick='reviewMistake(${u},${JSON.stringify(word)})' style="flex:1;">`;
    html += `<div class="mistake-word">${esc(w.word)} <span style="color:var(--sub);font-weight:normal;font-size:12px;">${esc(w.pos)}</span></div>`;
    html += `<div class="mistake-zh">${esc(w.zh)}（第${u}單元：${esc(UNIT_META[u].zh)}）</div>`;
    html += `</div>`;
    html += `<button class="speak-btn small2" onclick='speak(${JSON.stringify(w.word)},"en-US")'>🔊</button>`;
    html += `</div>`;
  });
  html += '<button class="btn danger" onclick="clearMistakes()">🗑 清空錯題本</button>';
  render(html);
}
function reviewMistake(uno, word){
  const list = WORDS_BY_UNIT[uno] || [];
  const w = list.find(x=>x.word===word);
  if(!w) return;
  let html = '<button class="back-btn" onclick="goMistakeBook()">← 返回錯題本</button>';
  html += '<div class="flash-card">';
  html += `<div class="flash-word">${esc(w.word)}</div>`;
  html += `<div class="flash-kk">${esc(w.kk)}</div>`;
  html += `<div class="flash-pos">${esc(w.pos)}</div>`;
  html += `<button class="speak-btn" onclick='speak(${JSON.stringify(w.word)},"en-US")'>🔊</button>`;
  html += `<div class="flash-zh" style="margin-top:14px;">${esc(w.zh)}</div>`;
  html += '<div class="flash-sen">';
  html += `${esc(w.sen_en)} <button class="speak-btn small2" onclick='speak(${JSON.stringify(w.sen_en)},"en-US")'>🔊</button>`;
  html += `<div class="flash-sen-zh">${esc(w.sen_zh)}</div>`;
  html += '</div></div>';
  html += `<button class="btn secondary" onclick='markKnowMistake(${uno},${JSON.stringify(word)})'>😀 我學會了，移出錯題本</button>`;
  html += `<button class="btn outline" onclick="goMistakeBook()">回錯題本</button>`;
  render(html);
}
function markKnowMistake(uno, word){
  const list = WORDS_BY_UNIT[uno] || [];
  const w = list.find(x=>x.word===word);
  if(w){ markLearned(w); removeMistake(w); toast('已移出錯題本！'); }
  goMistakeBook();
}
function clearMistakes(){
  if(confirm('確定要清空整個錯題本嗎？')){
    saveMistakes({});
    toast('錯題本已清空');
    goMistakeBook();
  }
}


// ---------- 啟動 ----------
goHome();
</script>
</body>
</html>
