<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日深度日記</title>
<style>
:root{--bg:#f6f2ec;--card:#fffdf9;--ink:#3b3631;--sub:#7d746a;--line:#e6dfd4;--accent:#8aa391;--accent-ink:#2f4a39;--warm:#c9a98b;--field:#faf6ef}
@media (prefers-color-scheme:dark){:root{--bg:#1d1f1e;--card:#262a28;--ink:#e8e3da;--sub:#a29a8e;--line:#363b38;--accent:#7f9c88;--accent-ink:#0f1b14;--warm:#b79a80;--field:#1f2321}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
header{margin-bottom:22px}
h1{font-size:15px;font-weight:500;color:var(--sub);letter-spacing:.15em;margin:0 0 6px}
.date{font-size:26px;font-weight:600;margin:0}
.hint{color:var(--sub);margin:6px 0 0;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}
.card.deep{border-color:var(--warm)}
.tag{display:inline-block;font-size:13px;color:var(--sub);letter-spacing:.1em;margin-bottom:4px}
.q{font-size:19px;font-weight:600;margin:0 0 10px;line-height:1.55}
textarea{width:100%;min-height:84px;resize:none;overflow:hidden;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;line-height:1.7}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:400;padding:7px 14px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.save{width:100%;padding:15px;font-size:19px;margin-top:6px}
#toast{text-align:center;color:var(--accent);min-height:30px;margin:8px 0 0;transition:opacity .4s}
h2{font-size:18px;margin:34px 0 10px;color:var(--sub);font-weight:500;letter-spacing:.08em}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
details .item{margin-top:14px}
details .item b{display:block;color:var(--sub);font-size:15px;font-weight:500}
details .item div{white-space:pre-wrap;word-break:break-word}
.empty{color:var(--sub)}
.small{color:var(--sub);font-size:14px;line-height:1.6}
.sw{font-size:14px;padding:5px 12px;margin:0 0 8px;background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:400}
.sw.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:15px;color:var(--sub);margin-bottom:6px}
#err{color:#b3472f;font-size:14px;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.login{text-align:center;padding:40px 0}
input.code{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:9px 14px;width:9em;text-transform:uppercase}
.mycode{font-size:22px;font-weight:600;letter-spacing:.2em}
</style>
</head>
<body>
<main>
<div class="bar" id="bar" hidden><span id="uname"></span><button class="ghost" id="logoutBtn" type="button">登出</button></div>
<header>
<h1>每日深度日記</h1>
<p class="date" id="dateText"></p>
<p class="hint">慢慢寫，寫一句也算數。空白也沒關係。</p>
</header>

<div class="login" id="authBox"><p class="hint">登入後，日記會存在雲端。</p><button id="loginBtn" type="button">用 Google 登入</button></div>
<div id="err" role="alert"></div>
<div id="app" hidden>
<div id="legacy" class="card" hidden><p>發現這支手機有舊日記，上傳到雲端？</p><button id="legacyBtn" type="button">上傳到雲端</button></div>
<section id="fixed"></section>

<div class="card deep">
<span class="tag">今日深度題・大家今天都是同一題</span>
<div id="swDaily"></div>
<p class="q" id="dailyQ"></p>
<textarea id="dailyA" placeholder="想到什麼就寫什麼"></textarea>
</div>

<div class="card">
<span class="tag">隨機一題</span>
<div id="swRandom"></div>
<p class="q" id="randQ"></p>
<textarea id="randA" placeholder="想到什麼就寫什麼"></textarea>
<div class="row" style="margin-top:10px"><button class="ghost" id="reroll" type="button">換一題</button></div>
</div>

<button class="save" id="saveBtn" type="button">儲存今天</button>
<div id="toast" role="status" aria-live="polite"></div>

<h2>過去的日記</h2>
<div id="history"></div>

<h2>好友</h2>
<div class="card"><div class="small">我的好友碼</div><div class="row"><span class="mycode" id="myCode">------</span><button class="ghost" id="copyCode" type="button">複製</button></div>
<div class="row" style="margin-top:12px"><input class="code" id="friendCode" maxlength="6" placeholder="對方好友碼"><button class="ghost" id="addFriend" type="button">加好友</button></div>
<p class="small">雙方都要互加，對方才看得到你分享的、你也才看得到他的。</p>
<div id="friends"></div></div>
<h2>好友分享的</h2>
<div id="shared"></div>
<h2>備份</h2>
<div class="row">
<button class="ghost" id="exportBtn" type="button">下載備份</button>
</div>

</div>
<p class="small" style="margin-top:30px">標 👀 的題目（預設）互加的好友看得到；點成 🔒 就只有自己看得到。</p>
</main>

function sharedItems(e){
 var it=[],s=e.share||{};
 (e.fixed||[]).forEach(function(a,i){if(s["f"+i]&&a&&a.trim())it.push({q:FIXED[i]||"",a:a});});
 if(s.daily&&e.daily&&e.daily.a&&e.daily.a.trim())it.push({q:e.daily.q,a:e.daily.a});
 if(s.random&&e.random&&e.random.a&&e.random.a.trim())it.push({q:e.random.q,a:e.random.a});
 return it;
}
async function writeEntry(e){
 await setDoc(doc(db,"users",uid,"entries",e.date),e);
 var items=sharedItems(e);
 if(items.length)await setDoc(doc(db,"users",uid,"shared",e.date),{date:e.date,name:(me&&me.name)||"",items:items,savedAt:e.savedAt});
 else await deleteDoc(doc(db,"users",uid,"shared",e.date));
}
$("saveBtn").onclick=async function(){
 try{errClear();await writeEntry(collect());toast("已經收好了。今天的你，辛苦了。");await renderHistory();}
 catch(e){errShow("儲存失敗",e);toast("這次沒存成功。");}
};
// comments: users/{ownerUid}/shared/{date}/comments/{cid}
function fmtAt(t){try{var d=new Date(t);return isNaN(d)?String(t||""):(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}catch(e){return "";}}
function mountComments(d,ownerUid,date){
 var wrap=document.createElement("div");wrap.className="item";
 var hd=document.createElement("b");hd.textContent="💬 留言";wrap.appendChild(hd);
 var list=document.createElement("div");list.style.whiteSpace="normal";wrap.appendChild(list);
 var row=document.createElement("div");row.className="row";row.style.marginTop="8px";
 var inp=document.createElement("input");inp.type="text";inp.maxLength=500;inp.placeholder="寫點什麼…";inp.style.cssText="flex:1;min-width:120px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:14px;padding:9px 12px;font:inherit";
 var btn=document.createElement("button");btn.type="button";btn.className="ghost";btn.textContent="留言";
 row.appendChild(inp);row.appendChild(btn);wrap.appendChild(row);d.appendChild(wrap);
 async function load(){
  try{
   var snap=await getDocs(query(collection(db,"users",ownerUid,"shared",date,"comments"),orderBy("at")));
   list.textContent="";
   if(snap.empty){var e=document.createElement("div");e.className="small";e.textContent="還沒有留言。";list.appendChild(e);return;}
   snap.forEach(function(cd){
    var c=cd.data(),p=document.createElement("div");p.style.cssText="margin:6px 0;white-space:pre-wrap;word-break:break-word";
    var n=document.createElement("span");n.style.color="var(--sub)";n.textContent=(c.name||"?")+"　";
    var t=document.createElement("span");t.textContent=c.text||"";
    var at=document.createElement("span");at.className="small";at.textContent="　"+fmtAt(c.at);
    p.appendChild(n);p.appendChild(t);p.appendChild(at);
    if(c.by===uid){var del=document.createElement("button");del.type="button";del.className="ghost";del.style.cssText="padding:2px 10px;font-size:13px;margin-left:6px";del.textContent="刪除";
     del.onclick=async function(){try{errClear();await deleteDoc(doc(db,"users",ownerUid,"shared",date,"comments",cd.id));await load();}catch(e2){errShow("刪除留言失敗",e2);}};p.appendChild(del);}
    list.appendChild(p);
   });
  }catch(e){errShow("讀取留言失敗",e);}
 }
 btn.onclick=async function(){
  var tx=inp.value.trim();if(!tx)return;
  try{errClear();
   await addDoc(collection(db,"users",ownerUid,"shared",date,"comments"),{by:uid,name:(me&&me.name)||"",text:tx.slice(0,500),at:new Date().toISOString()});
   inp.value="";await load();
  }catch(e){errShow("留言失敗",e);}
 };
 var loaded=false;
 d.addEventListener("toggle",function(){if(d.open&&!loaded){loaded=true;load();}});
}
function icon(on){return on?"👀 ":"🔒 ";}
var myEntries=[];
async function loadEntries(){
 var snap=await getDocs(collection(db,"users",uid,"entries"));
 var out=[];snap.forEach(function(d){var o=d.data();o.date=o.date||d.id;out.push(o);});
 out.sort(function(a,b){return a.date<b.date?1:-1;});
 return out;
}
async function renderHistory(){
 var box=$("history");
 try{
  myEntries=await loadEntries();
  box.textContent="";
  var items=myEntries.slice(0,60);
  if(!items.length){var e=document.createElement("p");e.className="empty";e.textContent="還沒有日記，今天就是第一頁。";box.appendChild(e);return;}
  items.forEach(function(o){
   var d=document.createElement("details"),s=document.createElement("summary");s.textContent=o.date;d.appendChild(s);
   var sh=o.share||{};
   function add(label,text,on){if(!text||!String(text).trim())return;var w=document.createElement("div");w.className="item";var b=document.createElement("b");b.textContent=icon(on)+label;var v=document.createElement("div");v.textContent=String(text);w.appendChild(b);w.appendChild(v);d.appendChild(w);}
   (o.fixed||[]).forEach(function(v,i){add(FIXED[i]||"",v,sh["f"+i]);});
   if(o.daily)add(o.daily.q,o.daily.a,sh.daily);
   if(o.random)add(o.random.q,o.random.a,sh.random);
   if(sharedItems(o).length)mountComments(d,uid,o.date);
   box.appendChild(d);
  });
 }catch(e){errShow("讀取過去日記失敗",e);}
}
async function loadToday(){
 try{
  var s=await getDoc(doc(db,"users",uid,"entries",TODAY));
  if(!s.exists())return;
  var v=s.data();
  (v.fixed||[]).forEach(function(x,i){if(fixedAreas[i]){fixedAreas[i].value=x||"";grow(fixedAreas[i]);}});
  if(v.daily&&v.daily.q===dailyQ){$("dailyA").value=v.daily.a||"";grow($("dailyA"));}
  if(v.random&&v.random.q){randQ=v.random.q;$("randQ").textContent=randQ;$("randA").value=v.random.a||"";grow($("randA"));}
  var sh=v.share||{};for(var k in share){share[k]=!!sh[k];paintSw(k);}
 }catch(e){errShow("讀取今天失敗",e);}
}
// friends
var friendUids=[];
async function renderFriends(){
 var box=$("friends");box.textContent="";
 var names=[];
 for(var i=0;i<friendUids.length;i++){
  var f=friendUids[i],nm=f.slice(0,6);
  try{var s=await getDoc(doc(db,"users",f));if(s.exists())nm=s.data().name||nm;}catch(e){errShow("讀取好友失敗",e);}
  names.push({uid:f,name:nm});
  var p=document.createElement("div");p.className="small";p.textContent="・"+nm;box.appendChild(p);
 }
 return names;
}
async function renderShared(){
 var box=$("shared");box.textContent="";
 if(!friendUids.length){var e=document.createElement("p");e.className="empty";e.textContent="還沒有好友。";box.appendChild(e);return;}
 for(var i=0;i<friendUids.length;i++){
  var f=friendUids[i],nm=f.slice(0,6);
  try{var us=await getDoc(doc(db,"users",f));if(us.exists())nm=us.data().name||nm;}catch(e){}
  var sec=document.createElement("div");var h=document.createElement("div");h.className="small";h.textContent=nm;sec.appendChild(h);
  try{
   var snap=await getDocs(collection(db,"users",f,"shared"));
   var arr=[];snap.forEach(function(d){arr.push(d.data());});
   arr.sort(function(a,b){return a.date<b.date?1:-1;});arr=arr.slice(0,30);
   if(!arr.length){var m=document.createElement("p");m.className="empty";m.textContent="還沒有分享的日記。";sec.appendChild(m);}
   arr.forEach(function(o){
    var d=document.createElement("details"),s=document.createElement("summary");s.textContent=o.date;d.appendChild(s);
    (o.items||[]).forEach(function(it){var w=document.createElement("div");w.className="item";var b=document.createElement("b");b.textContent=it.q;var v=document.createElement("div");v.textContent=it.a;w.appendChild(b);w.appendChild(v);d.appendChild(w);});
    mountComments(d,f,o.date);
    sec.appendChild(d);
   });
  }catch(e){var m2=document.createElement("p");m2.className="empty";m2.textContent="對方還沒加你為好友";sec.appendChild(m2);console.warn(e);}
  box.appendChild(sec);
 }
}
$("copyCode").onclick=async function(){try{await navigator.clipboard.writeText($("myCode").textContent);toast("好友碼已複製");}catch(e){errShow("複製失敗",e);}};
$("addFriend").onclick=async function(){
 try{
  errClear();
  var code=$("friendCode").value.trim().toUpperCase();
  if(!code){toast("請先輸入好友碼");return;}
  var snap=await getDocs(query(collection(db,"users"),where("code","==",code)));
  var fu=null;snap.forEach(function(d){if(!fu)fu=d.id;});
  if(!fu){toast("找不到這個好友碼");return;}
  if(fu===uid){toast("這是你自己的好友碼");return;}
  await updateDoc(doc(db,"users",uid),{friends:arrayUnion(fu),updatedAt:new Date().toISOString()});
  if(friendUids.indexOf(fu)<0)friendUids.push(fu);
  $("friendCode").value="";toast("已加入好友");
  await renderFriends();await renderShared();
 }catch(e){errShow("加好友失敗",e);}
};
// backup
$("exportBtn").onclick=async function(){
 try{
  var list=await loadEntries();
  var data={app:"dd_cloud",exportedAt:new Date().toISOString(),entries:list};
  var blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="diary-backup-"+TODAY+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);toast("備份已下載。");
 }catch(e){errShow("下載備份失敗",e);}
};
// legacy
function legacyList(){var out=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(P)===0){var o=JSON.parse(localStorage.getItem(k));if(o){o.date=k.slice(P.length);out.push(o);}}}}catch(e){}return out;}
function checkLegacy(){$("legacy").hidden=legacyList().length===0;}
$("legacyBtn").onclick=async function(){
 try{
  errClear();var n=0,l=legacyList();
  for(var i=0;i<l.length;i++){
   var o=l[i];if(!/^\d{4}-\d{2}-\d{2}$/.test(o.date))continue;
   var e={date:o.date,fixed:o.fixed||[],daily:o.daily||{q:"",a:""},random:o.random||{q:"",a:""},share:{f0:true,f1:true,f2:true,daily:true,random:true},savedAt:o.savedAt||new Date().toISOString()};
   await writeEntry(e);n++;
  }
  toast("已上傳 "+n+" 天。");$("legacy").hidden=true;await renderHistory();
 }catch(e){errShow("上傳舊日記失敗",e);}
};
// auth
$("loginBtn").onclick=async function(){
 errClear();var prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:"select_account"});
 $("err").textContent="登入中…（如果跳出 Google 視窗，選帳號就好）";
 try{await signInWithPopup(auth,prov);errClear();}
 catch(e){
  var c=(e&&e.code)||"";
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"){$("err").textContent="登入視窗被關掉了，再按一次登入。";return;}
  if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){
   $("err").textContent="瀏覽器擋了彈出視窗，改用整頁登入…";
   try{try{sessionStorage.setItem("dd_redir","1");}catch(_){}await signInWithRedirect(auth,prov);}catch(e2){errShow("登入失敗",e2);}
   return;
  }
  errShow("登入失敗",e);
 }
};
$("logoutBtn").onclick=async function(){try{await signOut(auth);}catch(e){errShow("登出失敗",e);}};
getRedirectResult(auth).then(function(r){if(!r&&sessionStorage.getItem("dd_redir")){$("err").textContent="整頁登入回來後沒拿到帳號（Safari 擋了跨網站資料）。請到 設定→Safari→關掉「防止跨網站追蹤」再試，或改用 Chrome 開。";}try{sessionStorage.removeItem("dd_redir");}catch(_){}}).catch(function(e){errShow("登入失敗(redirect)",e);});
async function ensureUser(u){
 var ref=doc(db,"users",u.uid),s=await getDoc(ref);
 if(!s.exists()){
  var nu={name:u.displayName||"",code:u.uid.slice(0,6).toUpperCase(),friends:[],updatedAt:new Date().toISOString()};
  await setDoc(ref,nu);return nu;
 }
 return s.data();
}
(function(){var ua=navigator.userAgent||"";if(/Line\/|Instagram|FBAN|FBAV|Telegram|MicroMessenger/i.test(ua)){$("err").textContent="⚠️ 你現在是在 App 內建的瀏覽器裡，Google 會擋登入。請點右上角「⋯」→ 用 Safari／Chrome 開啟。";}})();
onAuthStateChanged(auth,async function(u){
 if(!u){uid=null;me=null;$("authBox").hidden=false;$("app").hidden=true;$("bar").hidden=true;resetForm();return;}
 uid=u.uid;
 $("authBox").hidden=true;$("app").hidden=false;$("bar").hidden=false;$("uname").textContent=u.displayName||"";
 try{
  me=await ensureUser(u);
  $("myCode").textContent=me.code||u.uid.slice(0,6).toUpperCase();
  friendUids=(me.friends||[]).slice();
 }catch(e){errShow("建立使用者失敗",e);me={name:u.displayName||""};}
 checkLegacy();
 await loadToday();
 await renderHistory();
 await renderFriends();
 await renderShared();
});
</script>
