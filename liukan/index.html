<!DOCTYPE html>
<html lang="zh-Hant" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的留看">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f8">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("liukan_theme")||"glass")}catch(e){document.documentElement.setAttribute("data-theme","glass")}</script>
<link rel="apple-touch-icon" href="icon.png">
<title>我的留看</title>
<style>
:root,html[data-theme="glass"]{--bg:#f4f5f8;--bgimg:radial-gradient(520px 420px at 8% 4%,rgba(214,190,245,.42),transparent 70%),radial-gradient(560px 460px at 100% 28%,rgba(178,210,250,.40),transparent 70%),radial-gradient(520px 420px at 20% 100%,rgba(240,196,226,.34),transparent 70%);
--ink:#1d1d1f;--sub:#6e6e73;--accent:#8e7cc3;--glass:rgba(255,255,255,.55);--glass-brd:rgba(255,255,255,.7);--blur:blur(20px) saturate(160%);
--btn:linear-gradient(135deg,rgba(206,186,244,.62),rgba(170,208,248,.62));--btn-ink:#2a2150;--btn-brd:rgba(255,255,255,.75);
--alt:rgba(255,255,255,.5);--alt-ink:#1d1d1f;--danger:rgba(250,200,200,.5);--danger-ink:#8a1f1f;
--chip:rgba(255,255,255,.5);--chip-on:rgba(190,172,236,.5);--chip-on-ink:#2a2150;--chip-on-brd:rgba(142,124,195,.55);
--input:rgba(255,255,255,.65);--tip:rgba(255,255,255,.5);--toast:rgba(29,29,31,.88);--modal:rgba(40,40,60,.28);
--t-Threads:rgba(60,60,70,.10);--t-FB:rgba(80,130,220,.14);--t-IG:rgba(230,100,160,.14);--t-oth:rgba(142,124,195,.16);--t-cat:rgba(90,190,150,.16);
--tag-ink:#3a3a42;--shadow:0 8px 30px rgba(0,0,0,.06);--line:rgba(0,0,0,.08);--warn:#a63a2c}
html[data-theme="frost"]{--bg:#eef3fa;--bgimg:radial-gradient(540px 440px at 5% 0%,rgba(212,228,247,.9),transparent 70%),radial-gradient(560px 460px at 100% 35%,rgba(192,210,236,.55),transparent 70%),radial-gradient(520px 420px at 15% 100%,rgba(212,228,247,.8),transparent 70%);
--ink:#1c2a40;--sub:#566680;--accent:#4a6fa5;--glass:rgba(250,250,250,.6);--glass-brd:rgba(255,255,255,.8);--blur:blur(20px) saturate(150%);
--btn:linear-gradient(135deg,rgba(74,111,165,.93),rgba(58,92,148,.93));--btn-ink:#fff;--btn-brd:rgba(255,255,255,.45);
--alt:rgba(212,228,247,.55);--alt-ink:#1c2a40;--danger:rgba(235,205,210,.55);--danger-ink:#8a1f2f;
--chip:rgba(250,250,250,.55);--chip-on:rgba(74,111,165,.18);--chip-on-ink:#1c3354;--chip-on-brd:rgba(74,111,165,.6);
--input:rgba(250,250,250,.7);--tip:rgba(212,228,247,.5);--toast:rgba(28,42,64,.9);--modal:rgba(28,42,64,.28);
--t-Threads:rgba(192,192,192,.35);--t-FB:rgba(74,111,165,.15);--t-IG:rgba(200,120,160,.15);--t-oth:rgba(112,128,144,.16);--t-cat:rgba(212,228,247,.8);
--tag-ink:#2c3b52;--shadow:0 8px 30px rgba(40,70,120,.08);--line:rgba(74,111,165,.15);--warn:#a63a2c}
html[data-theme="mono"]{--bg:#f6f6f7;--bgimg:none;
--ink:#1d1d1f;--sub:#5d6b79;--accent:#36454f;--glass:#ffffff;--glass-brd:#d3d3d3;--blur:none;
--btn:#1d1d1f;--btn-ink:#fff;--btn-brd:#1d1d1f;
--alt:#fff;--alt-ink:#1d1d1f;--danger:#fff;--danger-ink:#9a2a2a;
--chip:#fff;--chip-on:#e8c9cf;--chip-on-ink:#1d1d1f;--chip-on-brd:#d9aab3;
--input:#fff;--tip:#f0f0f1;--toast:#1d1d1f;--modal:rgba(30,35,40,.35);
--t-Threads:#ececec;--t-FB:#e8edf2;--t-IG:#f3e6e9;--t-oth:#ececec;--t-cat:#f0f0f1;
--tag-ink:#36454f;--shadow:0 8px 30px rgba(0,0,0,.05);--line:#d3d3d3;--warn:#a63a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bgimg) no-repeat fixed;background-color:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 28px) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:16px 20px}
header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:4px 0 10px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.glass,.panel,.card,.tip,.modal .box,.btn.alt,.btn.danger,.iconbtn,.chip,input[type=text],input[type=search],textarea{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.btn{display:block;width:100%;padding:13px 16px;border-radius:14px;font-size:18px;font-weight:600;letter-spacing:.01em;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn-brd);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.alt{background:var(--alt);color:var(--alt-ink);border:1px solid var(--glass-brd);box-shadow:none}
.btn.small{display:inline-block;width:auto;font-size:16px;padding:9px 14px;border-radius:14px;box-shadow:none}
.btn.danger{background:var(--danger);color:var(--danger-ink);border:1px solid var(--glass-brd);box-shadow:none}
.iconbtn{background:var(--alt);border:1px solid var(--glass-brd);width:42px;height:42px;border-radius:50%;font-size:18px;line-height:1;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--chip);border:1px solid var(--glass-brd);font-size:16px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--chip-on);border-color:var(--chip-on-brd);color:var(--chip-on-ink);font-weight:600}
input[type=text],input[type=search],textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--glass-brd);background:var(--input);color:var(--ink);margin:8px 0;-webkit-appearance:none;outline:none}
input::placeholder{color:var(--sub);opacity:.85}
input:focus{border-color:var(--accent)}
.panel{background:var(--glass);border-radius:20px;padding:18px;margin:14px 0;border:1px solid var(--glass-brd);box-shadow:var(--shadow)}
.tip{background:var(--tip);border:1px solid var(--glass-brd);border-radius:20px;padding:12px 44px 12px 14px;position:relative;margin:10px 0 14px;font-size:15px;color:var(--ink)}
.tip .x{position:absolute;right:4px;top:4px;background:none;font-size:18px;width:40px;height:40px;color:var(--sub)}
.card{background:var(--glass);border-radius:20px;padding:16px;margin:14px 0;border:1px solid var(--glass-brd);box-shadow:var(--shadow)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;margin-right:6px;color:var(--tag-ink);border:1px solid var(--glass-brd)}
.tag .e{font-size:12px}
.p-Threads{background:var(--t-Threads)}.p-FB{background:var(--t-FB)}.p-IG{background:var(--t-IG)}.p-其他{background:var(--t-oth)}
.cat{background:var(--t-cat)}
.note{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:10px 0 2px;word-break:break-all}
.meta{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1}
.empty{text-align:center;padding:24px 12px}
.empty ol{text-align:left;font-size:17px;padding-left:26px;color:var(--ink)}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:var(--toast);color:#fff;padding:11px 20px;border-radius:999px;font-size:16px;z-index:99;max-width:90%;text-align:center;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.modal{position:fixed;inset:0;background:var(--modal);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;padding:20px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.modal .box{background-color:var(--glass)}
html[data-theme="glass"] .modal .box,html[data-theme="frost"] .modal .box{background:rgba(255,255,255,.8)}
.url{color:var(--sub);font-size:13px;word-break:break-all}
.catrow{display:flex;gap:8px;align-items:center;margin:10px 0}
.catrow span{flex:1;font-size:17px}
.themes{display:flex;gap:10px;margin-top:6px}
.themes button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:14px;background:var(--chip);border:1px solid var(--glass-brd);font-size:14px;color:var(--ink)}
.themes button.on{border-color:var(--chip-on-brd);background:var(--chip-on);color:var(--chip-on-ink);font-weight:600}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
.sw.glass{background:linear-gradient(135deg,#d9c8f5,#b9d6f8)}.sw.frost{background:linear-gradient(135deg,#d4e4f7,#4a6fa5)}.sw.mono{background:linear-gradient(135deg,#fff 50%,#36454f 50%)}
.emlabel{font-size:14px;color:var(--sub);margin:12px 0 6px}.emgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:190px;overflow-y:auto;margin-bottom:8px}.emgrid .em{font-size:22px;line-height:1;aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:rgba(255,255,255,.6);padding:0;cursor:pointer}.emgrid .em.on{border-color:currentColor;background:rgba(142,124,195,.18)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var P="liukan_";
function load(k,d){try{var v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true}catch(e){toast("儲存失敗，請確認不是無痕模式");return false}}
var DEFCATS=[{id:"c1",name:"運動",emoji:"🏃"},{id:"c2",name:"食譜",emoji:"🍳"},{id:"c3",name:"餐廳",emoji:"🍜"},{id:"c4",name:"景點",emoji:"🏞️"}];
var cats=load("cats",null);if(!cats){cats=DEFCATS;save("cats",cats)}
var items=load("items",[]);
var view="home",filter="all",q="",draft=null,tipClosed=load("tipclosed",false);
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function platform(u){var h="";try{h=new URL(u).hostname.toLowerCase()}catch(e){return "其他"}
 if(/(^|\.)threads\.(net|com)$/.test(h))return "Threads";
 if(/(^|\.)(facebook\.com|fb\.com|fb\.watch)$/.test(h))return "FB";
 if(/(^|\.)instagram\.com$/.test(h))return "IG";return "其他"}
function extractUrl(t){var m=String(t||"").match(/https?:\/\/[^\s]+/i);return m?m[0]:""}
function catOf(id){for(var i=0;i<cats.length;i++)if(cats[i].id===id)return cats[i];return null}
function catLabel(id){var c=catOf(id);return c?(c.emoji?c.emoji+" ":"")+c.name:"未分類"}
function fmt(ts){var d=new Date(ts);return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()}
function norm(u){return u.replace(/#.*$/,"").replace(/\/+$/,"")}
function saveItems(){return save("items",items)}
function saveCats(){return save("cats",cats)}
function confirmBox(msg,okText,cb){
 var m=document.createElement("div");m.className="modal";
 m.innerHTML='<div class="box"><p style="font-size:21px;margin-top:0">'+esc(msg)+'</p><div class="row"><button class="btn alt small" style="flex:1" data-n>再想想</button><button class="btn danger small" style="flex:1" data-y>'+esc(okText)+'</button></div></div>';
 document.body.appendChild(m);
 m.querySelector("[data-n]").onclick=function(){m.remove()};
 m.querySelector("[data-y]").onclick=function(){m.remove();cb()}}
var EMOJIS=["📱","💻","🏃","🧘","🏋️","🚴","🍳","🍰","🥗","☕","🍜","🍣","🍔","🏞️","✈️","🏖️","⛰️","🏨","🛍️","👗","💄","💅","🏠","🪴","📚","✏️","🎓","💰","📈","🎬","🎵","🎨","📷","🐶","👶","💊","❤️","⭐","🎁","📝"];
function promptBox(title,val,emojiToo,cb,emVal){
 var m=document.createElement("div");m.className="modal";var sel=emVal||"";
 var grid="";if(emojiToo){grid='<div class="emlabel">選一個圖示</div><div class="emgrid">'+EMOJIS.map(function(e){return '<button type="button" class="em'+(e===sel?" on":"")+'" data-em="'+e+'">'+e+'</button>'}).join("")+'</div><input type="text" data-e maxlength="4" placeholder="或自己輸入表情符號（選填）" value="'+esc(sel)+'">'}
 m.innerHTML='<div class="box"><h2>'+esc(title)+'</h2><input type="text" data-n maxlength="12" placeholder="分類名稱" value="'+esc(val||"")+'">'+grid+'<div class="row"><button class="btn alt small" style="flex:1" data-c>取消</button><button class="btn small" style="flex:1" data-o>好</button></div></div>';
 document.body.appendChild(m);
 if(emojiToo){var ei=m.querySelector("[data-e]");m.querySelectorAll("[data-em]").forEach(function(b){b.onclick=function(){var e=b.getAttribute("data-em");var same=ei.value===e;ei.value=same?"":e;m.querySelectorAll("[data-em]").forEach(function(x){x.classList.toggle("on",!same&&x===b)})}});ei.oninput=function(){m.querySelectorAll("[data-em]").forEach(function(x){x.classList.toggle("on",x.getAttribute("data-em")===ei.value)})}}
 m.querySelector("[data-c]").onclick=function(){m.remove()};
 m.querySelector("[data-o]").onclick=function(){var n=m.querySelector("[data-n]").value.trim();var e=emojiToo?m.querySelector("[data-e]").value.trim():"";if(!n){toast("請輸入名稱");return}m.remove();cb(n,e)}}
function newCat(name,emoji){var c={id:"c"+Date.now()+Math.floor(Math.random()*999),name:name,emoji:emoji};cats.push(c);saveCats();return c}

var THEMES=[["glass","霧面玻璃"],["frost","冰藍霜"],["mono","極簡黑白"]];
var TCOLOR={glass:"#f4f5f8",frost:"#eef3fa",mono:"#f6f6f7"};
function curTheme(){var t=document.documentElement.getAttribute("data-theme");return TCOLOR[t]?t:"glass"}
function setTheme(t){if(!TCOLOR[t])t="glass";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("liukan_theme",t)}catch(e){}
 var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",TCOLOR[t])}
function tipHtml(){
 if(navigator.standalone===true||tipClosed)return "";
 return '<div class="tip">💡 點 Safari 下方的 <b>分享</b> → <b>加入主畫面</b>，就會變成桌面 App<button class="x" data-act="closetip" aria-label="關閉">✕</button></div>'}

function render(){
 if(view==="home")renderHome();else if(view==="add")renderAdd();else renderSettings()}

function renderHome(){
 var list=items.filter(function(it){
  if(filter!=="all"){if(filter==="none"){if(catOf(it.cat))return false}else if(it.cat!==filter)return false}
  if(q){var s=(it.note+" "+it.url+" "+catLabel(it.cat)+" "+it.platform).toLowerCase();if(s.indexOf(q.toLowerCase())<0)return false}
  return true});
 var none=items.filter(function(i){return !catOf(i.cat)}).length;
 var h='<header><h1>💗 我的留看</h1><button class="iconbtn" data-act="settings" aria-label="設定">⚙️</button></header>'+tipHtml()+
 '<button class="btn" data-act="add">📋 貼上連結</button>'+
 '<input type="search" id="q" placeholder="🔍 搜尋備註、網址、分類" value="'+esc(q)+'">'+
 '<div class="chips scroll"><button class="chip'+(filter==="all"?" on":"")+'" data-f="all">全部 '+items.length+'</button>';
 cats.forEach(function(c){var n=items.filter(function(i){return i.cat===c.id}).length;h+='<button class="chip'+(filter===c.id?" on":"")+'" data-f="'+c.id+'">'+esc((c.emoji?c.emoji+" ":"")+c.name)+' '+n+'</button>'});
 if(none)h+='<button class="chip'+(filter==="none"?" on":"")+'" data-f="none">未分類 '+none+'</button>';
 h+='</div>';
 if(!items.length){
  h+='<div class="panel empty"><div style="font-size:54px">🔖</div><h2>還沒有收藏喔</h2><ol><li>在 Threads、FB 或 IG 的貼文按「分享」，選「複製連結」</li><li>回到這裡，按上面粉紅色「貼上連結」</li><li>點一個分類，再寫一句備註</li><li>按「存起來」，以後就能在這裡找到囉</li></ol></div>'}
 else if(!list.length){h+='<div class="panel empty">找不到符合的貼文 🔎</div>'}
 list.forEach(function(it){
  h+='<div class="card"><span class="tag p-'+esc(it.platform)+'">'+esc(it.platform)+'</span><span class="tag cat">'+esc(catLabel(it.cat))+'</span>'+
  '<div class="note">'+esc(it.note||"（沒有備註）")+'</div><div class="meta">儲存於 '+fmt(it.ts)+'</div><div class="url">'+esc(it.url.slice(0,70))+'</div>'+
  '<div class="row"><a class="btn small" style="text-align:center;text-decoration:none;flex:1.4" href="'+esc(it.url)+'" target="_blank" rel="noopener">開啟原文</a><button class="btn alt small" data-edit="'+it.id+'">編輯</button><button class="btn danger small" data-del="'+it.id+'">刪除</button></div></div>'});
 app.innerHTML=h;
 var qi=document.getElementById("q");qi.oninput=function(){q=qi.value;var pos=qi.selectionStart;renderHome();var n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}

function renderAdd(){
 var d=draft;
 var h='<header><h1>新增收藏</h1><button class="iconbtn" data-act="home" aria-label="返回">✕</button></header>';
 if(!d.url){
  h+='<button class="btn" data-act="paste">📋 貼上連結</button>'+
  '<div class="panel '+(d.manual?'':'hide')+'" id="manual"><p style="margin:0">無法自動讀取，請在下面框框<b>長按 → 貼上</b>：</p><input type="text" id="murl" placeholder="長按這裡貼上連結" inputmode="url" autocapitalize="none"><button class="btn alt" data-act="useurl">確定</button></div>'+
  '<p class="meta">先到貼文按「分享 → 複製連結」，再回來按上面的按鈕。</p>'}
 else{
  h+='<div class="panel"><span class="tag p-'+d.platform+'">'+d.platform+'</span><div class="url">'+esc(d.url)+'</div>'+(d.dup?'<p style="color:#b5473a;margin:8px 0 0">⚠️ 這個連結已經存過囉（你仍可以再存一次）</p>':'')+'</div>'+
  '<h2>選分類</h2><div class="chips">';
  cats.forEach(function(c){h+='<button class="chip'+(d.cat===c.id?" on":"")+'" data-pick="'+c.id+'">'+esc((c.emoji?c.emoji+" ":"")+c.name)+'</button>'});
  h+='<button class="chip'+(d.cat===""?" on":"")+'" data-pick="">未分類</button><button class="chip" data-act="newcat">＋新增分類</button></div>'+
  '<h2>備註（選填）</h2><input type="text" id="note" placeholder="例如 鹽酥雞食譜、台中咖啡廳" value="'+esc(d.note)+'">'+
  '<button class="btn" data-act="saveit" style="margin-top:14px">💾 存起來</button>'+
  '<button class="btn alt" data-act="resetdraft" style="margin-top:14px">換一個連結</button>'}
 app.innerHTML=h}

function renderSettings(){
 var h='<header><h1>設定</h1><button class="iconbtn" data-act="home" aria-label="返回">✕</button></header>'+
 '<div class="panel"><h2>🎨 主題</h2><div class="themes">'+THEMES.map(function(t){return '<button data-theme-pick="'+t[0]+'" class="'+(curTheme()===t[0]?'on':'')+'"><span class="sw '+t[0]+'"></span>'+t[1]+'</button>'}).join("")+'</div></div>'+
 '<div class="panel"><h2>🗂️ 管理分類</h2>';
 cats.forEach(function(c){h+='<div class="catrow"><span>'+esc((c.emoji?c.emoji+" ":"")+c.name)+'</span><button class="btn alt small" data-rn="'+c.id+'">編輯</button><button class="btn danger small" data-dc="'+c.id+'">刪除</button></div>'});
 h+='<button class="btn alt" data-act="newcat2" style="margin-top:10px">＋新增分類</button></div>'+
 '<div class="panel"><h2>💾 備份</h2><p style="margin-top:0">你的收藏<b>只存在這支手機</b>裡。換手機或不小心清掉資料就會不見，建議偶爾備份一下。</p>'+
 '<button class="btn" data-act="export">匯出備份</button><div style="height:12px"></div><button class="btn alt" data-act="import">匯入備份</button>'+
 '<input type="file" id="file" accept=".json,application/json" class="hide"></div>'+
 '<button class="btn alt" data-act="home">← 回首頁</button>';
 app.innerHTML=h;
 document.getElementById("file").onchange=function(e){doImport(e.target.files[0]);e.target.value=""}}

function startDraft(url){
 var u=extractUrl(url);if(!u){toast("沒看到網址，請再複製一次連結");return false}
 var dup=items.some(function(i){return norm(i.url)===norm(u)});
 draft={url:u,platform:platform(u),cat:cats.length?cats[0].id:"",note:"",dup:dup};view="add";render();return true}
function pasteClip(){
 if(navigator.clipboard&&navigator.clipboard.readText){
  navigator.clipboard.readText().then(function(t){if(!startDraft(t)){}}).catch(function(){manual()})}
 else manual()}
function manual(){draft.manual=true;render();var m=document.getElementById("murl");if(m)m.focus()}
function doExport(){
 var data=JSON.stringify({app:"liukan",version:1,exported:Date.now(),cats:cats,items:items},null,1);
 var name="我的留看備份-"+fmt(Date.now()).replace(/\//g,"-")+".json";
 try{var f=new File([data],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"我的留看備份"}).catch(function(){});return}}catch(e){}
 try{var b=new Blob([data],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("已下載備份檔")}catch(e){toast("匯出失敗")}}
function doImport(file){
 if(!file)return;var r=new FileReader();
 r.onload=function(){try{
  var o=JSON.parse(r.result);if(!o||!Array.isArray(o.items))throw 0;
  (o.cats||[]).forEach(function(c){if(c&&c.id&&c.name&&!catOf(c.id))cats.push({id:String(c.id),name:String(c.name),emoji:c.emoji||""})});
  var have={};items.forEach(function(i){have[norm(i.url)]=1});var n=0,skip=0;
  o.items.forEach(function(i){if(!i||!i.url)return;var k=norm(String(i.url));if(have[k]){skip++;return}have[k]=1;
   items.push({id:String(i.id||("i"+Date.now()+Math.random())),url:String(i.url),platform:i.platform||platform(i.url),cat:i.cat||"",note:String(i.note||""),ts:Number(i.ts)||Date.now()});n++});
  items.sort(function(a,b){return b.ts-a.ts});saveCats();saveItems();
  toast("匯入完成：新增 "+n+" 筆，略過重複 "+skip+" 筆");render()}catch(e){toast("這個檔案看不懂，請選之前匯出的備份檔")}};
 r.onerror=function(){toast("讀取檔案失敗")};r.readAsText(file)}

function editItem(id){
 var it=items.filter(function(i){return i.id===id})[0];if(!it)return;
 var m=document.createElement("div");m.className="modal";
 var o='<div class="chips">';cats.forEach(function(c){o+='<button class="chip'+(it.cat===c.id?" on":"")+'" data-c="'+c.id+'">'+esc((c.emoji?c.emoji+" ":"")+c.name)+'</button>'});
 o+='<button class="chip'+(!catOf(it.cat)?" on":"")+'" data-c="">未分類</button></div>';
 m.innerHTML='<div class="box"><h2>編輯</h2>'+o+'<input type="text" data-note placeholder="備註" value="'+esc(it.note)+'"><div class="row"><button class="btn alt small" style="flex:1" data-x>取消</button><button class="btn small" style="flex:1" data-ok>存好了</button></div></div>';
 document.body.appendChild(m);var sel=it.cat;
 m.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){sel=b.getAttribute("data-c");m.querySelectorAll("[data-c]").forEach(function(x){x.classList.remove("on")});b.classList.add("on")}});
 m.querySelector("[data-x]").onclick=function(){m.remove()};
 m.querySelector("[data-ok]").onclick=function(){it.cat=sel;it.note=m.querySelector("[data-note]").value.trim();saveItems();m.remove();render()}}

document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.hasAttribute("data-theme-pick")){setTheme(t.getAttribute("data-theme-pick"));render();return}
 var a=t.getAttribute("data-act");
 if(t.hasAttribute("data-f")){filter=t.getAttribute("data-f");render();return}
 if(t.hasAttribute("data-pick")){draft.note=(document.getElementById("note")||{}).value||draft.note;draft.cat=t.getAttribute("data-pick");render();return}
 if(t.hasAttribute("data-edit")){editItem(t.getAttribute("data-edit"));return}
 if(t.hasAttribute("data-del")){var id=t.getAttribute("data-del");confirmBox("確定要刪除這則收藏嗎？","刪除",function(){items=items.filter(function(i){return i.id!==id});saveItems();render()});return}
 if(t.hasAttribute("data-rn")){var c=catOf(t.getAttribute("data-rn"));promptBox("編輯分類",c.name,true,function(n,em){c.name=n;c.emoji=em;saveCats();render()},c.emoji);return}
 if(t.hasAttribute("data-dc")){var cid=t.getAttribute("data-dc"),cc=catOf(cid);
  confirmBox("確定刪除「"+cc.name+"」嗎？這個分類的貼文會移到「未分類」。","刪除",function(){items.forEach(function(i){if(i.cat===cid)i.cat=""});cats=cats.filter(function(x){return x.id!==cid});if(filter===cid)filter="all";saveCats();saveItems();render()});return}
 if(!a)return;
 if(a==="closetip"){tipClosed=true;save("tipclosed",true);render()}
 else if(a==="settings"){view="settings";render()}
 else if(a==="home"){view="home";draft=null;render()}
 else if(a==="add"){draft={url:"",manual:false};view="add";render();pasteClip()}
 else if(a==="paste"){pasteClip()}
 else if(a==="useurl"){startDraft(document.getElementById("murl").value)}
 else if(a==="resetdraft"){draft={url:"",manual:false};render()}
 else if(a==="newcat"){promptBox("新增分類",""  ,true,function(n,em){var c=newCat(n,em);draft.note=(document.getElementById("note")||{}).value||"";draft.cat=c.id;render()})}
 else if(a==="newcat2"){promptBox("新增分類","",true,function(n,em){newCat(n,em);render()})}
 else if(a==="saveit"){
  var note=document.getElementById("note").value.trim();
  items.unshift({id:"i"+Date.now()+Math.floor(Math.random()*999),url:draft.url,platform:draft.platform,cat:draft.cat,note:note,ts:Date.now()});
  if(saveItems()){draft=null;view="home";filter="all";q="";render();toast("已存起來 ✅")}}
 else if(a==="export"){doExport()}
 else if(a==="import"){document.getElementById("file").click()}
});
setTheme(curTheme());render();
})();
</script>
</body>
</html>
