<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--dim:#6b7280;--line:#e5e7eb;--accent:#2f7de1;--bad:#d84a4a}
@media (prefers-color-scheme:dark){
:root{--bg:#0f1115;--panel:#171a21;--ink:#e8eaed;--dim:#9aa1ac;--line:#262b35;--accent:#5aa2ff;--bad:#ff7b7b}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:22px;
font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
-webkit-text-size-adjust:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 24px;width:100%;max-width:370px;text-align:center;
box-shadow:0 10px 34px rgba(0,0,0,.07)}
.lock{font-size:42px;line-height:1;margin-bottom:12px}
h1{margin:0 0 6px;font-size:19px;font-weight:700}
p.sub{margin:0 0 20px;font-size:13.5px;color:var(--dim)}
input{width:100%;padding:13px 14px;font-size:17px;border-radius:12px;border:1px solid var(--line);
background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.4px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button{width:100%;margin-top:11px;padding:13px;font-size:16px;font-weight:650;border:0;border-radius:12px;
background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
button:disabled{opacity:.55;cursor:default}
.msg{margin-top:13px;font-size:13.5px;min-height:20px;color:var(--dim)}
.msg.err{color:var(--bad);font-weight:600}
.hint{margin-top:18px;font-size:11.5px;color:var(--dim);line-height:1.7}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--dim);border-top-color:transparent;
border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <h1>我的紀錄</h1>
  <p class="sub">這份東西是鎖起來的<br>輸入密碼才打得開</p>
  <form id="f">
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" autofocus>
    <button id="go" type="submit">打開</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="hint">🔐 內容用 AES-256 加密<br>沒有密碼的人下載原始碼也只會看到亂碼</div>
</div>

<script>
const KEY='wenny_rec_pw';
const $=id=>document.getElementById(id);
const msg=$('msg'), pw=$('pw'), go=$('go');
const P=JSON.parse($('payload').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function say(t,err){ msg.textContent=t; msg.className='msg'+(err?' err':''); }
function busy(t){ msg.innerHTML='<span class="spin"></span>'+t; msg.className='msg'; }

async function open_(password, silent){
  go.disabled=true; busy('解開中…');
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    let html;
    if(typeof DecompressionStream!=='undefined'){
      const ds=new DecompressionStream('gzip');
      html=await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();
    }else{ throw new Error('NOGZIP'); }
    localStorage.setItem(KEY,password);
    document.open(); document.write(html); document.close();
  }catch(e){
    go.disabled=false;
    if(e && e.message==='NOGZIP'){ say('這個瀏覽器太舊了，換 Safari 或 Chrome 開',1); return; }
    localStorage.removeItem(KEY);
    if(silent){ say(''); pw.focus(); }
    else { say('密碼不對 😐 再試一次',1); pw.value=''; pw.focus(); }
  }
}
$('f').onsubmit=e=>{ e.preventDefault(); const v=pw.value.trim(); if(v) open_(v,false); };
const saved=localStorage.getItem(KEY);
if(saved) open_(saved,true);
</script>
